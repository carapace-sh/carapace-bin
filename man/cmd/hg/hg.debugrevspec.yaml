# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: debugrevspec
description: REVSPEC
hidden: true
flags:
    --no-optimized: evaluate tree without optimization
    --optimize: print parsed tree after optimizing (DEPRECATED)
    --show-revs: print list of result revisions (default)
    --verify-optimized: verify optimized result
    -p, --show-stage=*: print parsed tree at the given stage
    -s, --show-set: print internal representation of result set
documentation:
    command: |
        parse and apply a revision specification

        Use -p/--show-stage option to print the parsed tree at the given stages.
        Use -p all to print tree at every stage.

        Use --no-show-revs option with -s or -p to print only the set
        representation or the parsed tree respectively.

        Use --verify-optimized to compare the optimized result with the unoptimized
        one. Returns 1 if the optimized result differs.
