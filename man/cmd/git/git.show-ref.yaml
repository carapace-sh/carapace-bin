# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: show-ref
description: List references in a local repository
group: low-level interrogator
flags:
  --abbrev?: abbreviate the object name
  --branches: limit to local branches
  --exclude-existing?: make git show-ref act as a filter that reads refs from stdin
  --exists: check whether the given reference exists
  --head: show the HEAD reference
  --tags: limit to local tags
  --verify: enable stricter reference checking by requiring an exact ref path
  -d, --dereference: dereference tags into object IDs as well
  -q, --quiet: do not print any results to stdout
  -s, --hash?: only show the OID, not the reference name
documentation:
  command: |-
    Displays references available in a local repository along with the associated
    commit IDs. Results can be filtered using a pattern and tags can be
    dereferenced into object IDs. Additionally, it can be used to test whether a
    particular ref exists.

    By default, shows the tags, heads, and remote refs.

    The `--exclude-existing` form is a filter that does the inverse. It reads
    refs from stdin, one ref per line, and shows those that don't exist in
    the local repository.

    The `--exists` form can be used to check for the existence of a single
    references. This form does not verify whether the reference resolves to an
    actual object.

    Use of this utility is encouraged in favor of directly accessing files under
    the `.git` directory.
  flag:
    tags: |-
      Instead of using only the annotated tags, use any tag
      found in `refs/tags` namespace.  This option enables matching
      a lightweight (non-annotated) tag.
    verify: Verify the cryptographic signature of the given tags.
    abbrev: |-
      Instead of using the default _7+1_ hexadecimal digits as the
      abbreviated object name, use _<m>+1_ digits, where _<m>_ is at
      least _<n>_ but ensures the commit object names are unique.
      Note that 1 column
      is used for a caret to mark the boundary commit.
    quiet: Be quiet. Only print error messages.
    branches: limit to local branches
    dereference: dereference tags into object IDs as well
    exclude-existing: make git show-ref act as a filter that reads refs from stdin
    exists: check whether the given reference exists
    hash: only show the OID, not the reference name
    head: show the HEAD reference
