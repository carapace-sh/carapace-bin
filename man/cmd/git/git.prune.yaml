# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: prune
description: Prune all unreachable objects from the object database
group: manipulator
flags:
  --exclude-promisor-objects: limit traversal to objects outside promisor packfiles
  --expire=: expire objects older than <time>
  --progress: show progress
  -n, --dry-run: do not remove, show only
  -v, --verbose: report pruned objects
documentation:
  command: |-
    NOTE: In most cases, users should run 'git gc', which calls
    'git prune'. See the section "NOTES", below.

    This runs 'git fsck --unreachable' using all the refs
    available in `refs/`, optionally with an additional set of
    objects specified on the command line, and prunes all unpacked
    objects unreachable from any of these head objects from the object database.
    In addition, it
    prunes the unpacked objects that are also found in packs by
    running `git prune-packed`.
    It also removes entries from .git/shallow that are not reachable by
    any ref.

    Note that unreachable, packed objects will remain.  If this is
    not desired, see [git-repack](cmd://git/repack).
  flag:
    exclude-promisor-objects: |-
      (For internal use only.)  Prefilter object traversal at
      promisor boundary.  This is used with partial clone.  This is
      stronger than `--missing=allow-promisor` because it limits the
      traversal, rather than just silencing errors about missing
      objects.
    expire: |-
      Prune entries older than the specified time. If this option is
      not specified, the expiration time is taken from the
      configuration setting `gc.reflogExpire`, which in turn
      defaults to 90 days. `--expire=all` prunes entries regardless
      of their age; `--expire=never` turns off pruning of reachable
      entries (but see `--expire-unreachable`).
    progress: |-
      Enable progress reporting on the standard error stream even if
      not attached to a terminal. By default, progress status is
      reported only when it is attached. You can't use `--progress`
      together with `--porcelain` or `--incremental`.
    dry-run: |-
      Don't actually add the file(s), just show if they exist and/or will
      be ignored.
    verbose: Report progress to stderr.
