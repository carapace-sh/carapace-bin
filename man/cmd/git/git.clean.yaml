# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: clean
description: Remove untracked files from the working tree
group: main
flags:
  -X: remove only ignored files
  -d: remove whole directories
  -e, --exclude=: add <pattern> to ignore rules
  -f, --force: force
  -i, --interactive: interactive cleaning
  -n, --dry-run: dry run
  -q, --quiet: do not print names of files removed
  -x: remove ignored files, too
documentation:
  command: |-
    Cleans the working tree by recursively removing files that are not
    under version control, starting from the current directory.

    Normally, only files unknown to Git are removed, but if the `-x`
    option is specified, ignored files are also removed. This can, for
    example, be useful to remove all build products.

    If any optional `<pathspec>...` arguments are given, only those paths
    that match the pathspec are affected.
  flag:
    x: |-
      When recording the commit, append a line that says "(cherry picked
      from commit ...)" to the original commit message in order to
      indicate which commit this cherry-pick was derived from.
    dry-run: |-
      Don't actually add the file(s), just show if they exist and/or will
      be ignored.
    exclude: |-
      These flags are passed to the *git apply* (see
      [git-apply](cmd://git/apply)) program that applies the patch.
      
      Valid \<action\> for the `--whitespace` option are: `nowarn`, `warn`, `fix`, `error`, and `error-all`.
    force: |-
      Allow adding otherwise ignored files. The option is also used when
      `submodule.<name>.ignore=all` is set, but you want to stage an
      update of the submodule. The `path` to the submodule must be explicitly
      specified.
    interactive: |-
      Add modified contents in the working tree interactively to
      the index. Optional path arguments may be supplied to limit
      operation to a subset of the working tree. See *Interactive
      mode* for details.
    quiet: Be quiet. Only print error messages.
    X: remove only ignored files
    d: remove whole directories
