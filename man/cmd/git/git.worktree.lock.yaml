# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: lock
description: Lock administrative files from being pruned automatically
flags:
  --expire=: add 'prunable' annotation to worktrees older than <time>
  --porcelain: machine-readable output
  -v, --verbose: show extended annotations and reasons, if available
  -z: terminate records with a NUL character
documentation:
  flag:
    porcelain: |-
      With `list`, output in an easy-to-parse format for scripts.
      This format will remain stable across Git versions and regardless of user
      configuration.  It is recommended to combine this with `-z`.
      See below for details.
    verbose: |-
      With `prune`, report all removals.

      With `list`, output additional information about worktrees (see below).
    z: |-
      Terminate each line with a _NUL_ rather than a newline when
      `--porcelain` is specified with `list`. This makes it possible
      to parse the output when a worktree path contains a newline
      character.
    expire: |-
      Prune entries older than the specified time. If this option is
      not specified, the expiration time is taken from the
      configuration setting `gc.reflogExpire`, which in turn
      defaults to 90 days. `--expire=all` prunes entries regardless
      of their age; `--expire=never` turns off pruning of reachable
      entries (but see `--expire-unreachable`).

