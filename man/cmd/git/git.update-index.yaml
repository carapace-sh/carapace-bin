# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: update-index
description: Register file contents in the working tree to the index
group: low-level manipulator
flags:
  --add: if a specified file isn’t in the index already then it’s added
  --assume-unchanged: set the "assume unchanged" bit for paths
  --cacheinfo=: directly insert the specified info into the index
  --chmod=: set the execute permissions on the updated files
  --clear-resolve-undo: forget saved unresolved conflicts
  --force-remove: remove the file from the index even when the working directory still has such a file
  --force-untracked-cache: same as --untracked-cache
  --force-write-index: opposite of --no-force-write-index
  --fsmonitor: enable files system monitor feature
  --fsmonitor-valid: set the "fsmonitor valid" bit for paths
  --ignore-missing: ignores missing files during a --refresh
  --ignore-skip-worktree-entries: do not remove skip-worktree (AKA "index-only") entries
  --ignore-submodules: do not try to update submodules
  --index-info: read index information from stdin
  --index-version=: write the resulting index out in the named on-disk format version
  --info-only: just insert object IDs into the index for following files
  --no-assume-unchanged: unset the "assume unchanged" bit for paths
  --no-fsmonitor: disable files system monitor feature
  --no-fsmonitor-valid: unset the "fsmonitor valid" bit for paths
  --no-ignore-skip-worktree-entries: remove skip-worktree (AKA "index-only") entries
  --no-skip-worktree: unset the "skip-worktree" bit for paths
  --no-split-index: disable split index mode
  --no-untracked-cache: disable untracked cache feature
  --really-refresh: like --refresh, but checks stat information unconditionally
  --refresh: looks at the current index and checks to see if merges or updates are needed
  --remove: if a specified file is in the index but is missing then it’s removed
  --replace: existing entries that conflict with the entry being added are automatically removed
  --show-index-version: report the index format version used by the on-disk index file
  --skip-worktree: set the "skip-worktree" bit for paths
  --split-index: enable split index mode
  --stdin: read a list of paths from the standard input
  --test-untracked-cache: only perform tests on the working directory to make sure untracked cache can be used
  --unmerged: continue if --refresh finds unmerged changes in the index
  --unresolve: restores the unmerged or needs updating state of a file during a merge
  --untracked-cache: enable untracked cache feature
  --verbose: report what is being added and removed from the index
  -g, --again: runs git update-index itself on the paths whose index entries differ from HEAD
  -q: quiet
  -z: paths are separated with NUL character instead of LF
documentation:
  command: |-
    Modifies the index. Each file mentioned is updated into the index and
    any 'unmerged' or 'needs updating' state is cleared.

    See also [git-add](cmd://git/add) for a more user-friendly way to do some of
    the most common operations on the index.

    The way 'git update-index' handles files it is told about can be modified
    using the various options:
  flag:
    chmod: |-
      Override the executable bit of the added files.  The executable
      bit is only changed in the index, the files on disk are left
      unchanged.
    ignore-missing: |-
      This option can only be used together with `--dry-run`. By using
      this option the user can check if any of the given files would
      be ignored, no matter if they are already present in the work
      tree or not.
    refresh: |-
      Don't add the file(s), but only refresh their stat()
      information in the index.
    stdin: |-
      The list of patterns is read from standard input instead of from
      the argument list.
    verbose: Be verbose.
    z: |-
      When `--numstat` has been given, do not munge pathnames,
      but use a NUL-terminated machine-readable format.
      
      Without this option, pathnames with "unusual" characters are quoted as
      explained for the configuration variable `core.quotePath` (see
      [git-config](cmd://git/config)).
    add: if a specified file isn’t in the index already then it’s added
    again: runs git update-index itself on the paths whose index entries differ from HEAD
    assume-unchanged: set the "assume unchanged" bit for paths
    cacheinfo: directly insert the specified info into the index
    clear-resolve-undo: forget saved unresolved conflicts
    force-remove: |-
