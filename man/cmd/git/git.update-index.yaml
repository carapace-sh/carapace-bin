    ignore-submodules: do not try to update submodules
    index-info: read index information from stdin
    index-version: write the resulting index out in the named on-disk format version
    info-only: just insert object IDs into the index for following files
    no-assume-unchanged: unset the "assume unchanged" bit for paths
    no-fsmonitor: disable files system monitor feature
    no-fsmonitor-valid: unset the "fsmonitor valid" bit for paths
    no-ignore-skip-worktree-entries: remove skip-worktree (AKA "index-only") entries
    no-skip-worktree: unset the "skip-worktree" bit for paths
    no-split-index: disable split index mode
    no-untracked-cache: disable untracked cache feature
    q: quiet
    really-refresh: like --refresh, but checks stat information unconditionally
