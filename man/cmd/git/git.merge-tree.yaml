# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: merge-tree
description: Perform merge without touching index or working tree
group: interrogator
flags:
  --allow-unrelated-histories: override common history check and make the merge proceed anyway
  --merge-base=: specify a merge-base for the merge
  --messages: write any informational messages such as "Auto-merging <path>" or CONFLICT notices to the end of stdout
  --name-only: in the Conflicted file info section
  --no-messages: do not write any informational messages such as "Auto-merging <path>" or CONFLICT notices to the end of stdout
  --quiet: disable all output; only exit status matters
  --stdin: perform multiple merges, one per line of input
  --trivial-merge: do a trivial merge only
  --write-tree: do a real merge instead of a trivial merge
  -X, --strategy-option=: pass merge strategy specific option through
  -z: do not quote filenames in the <Conflicted file info> section
documentation:
  command: |-
    This command has a modern `--write-tree` mode and a deprecated
    `--trivial-merge` mode.  With the exception of the
    DEPRECATED DESCRIPTION section at the end, the rest of
    this documentation describes the modern `--write-tree` mode.

    Performs a merge, but does not make any new commits and does not read
    from or write to either the working tree or index.

    The performed merge will use the same features as the "real"
    [git-merge](cmd: |-
      //git/merge), including:

     * three way content merges of individual files
     * rename detection
     * proper directory/file conflict handling
     * recursive ancestor consolidation (i.e. when there is more than one
      merge base, creating a virtual merge base by merging the merge bases)
     * etc.

    After the merge completes, a new toplevel tree object is created.  See
    `OUTPUT` below for details.
  flag:
    allow-unrelated-histories: |-
      By default, `git merge` command refuses to merge histories
      that do not share a common ancestor.  This option can be
      used to override this safety when merging histories of two
      projects that started their lives independently. As that is
      a very rare occasion, no configuration variable to enable
      this by default exists or will be added.
      
      Only useful when merging.
    name-only: |-
      Show only the name of each changed file in the post-image tree.
      The file names are often encoded in UTF-8.
      For more information see the discussion about encoding in the [git-log](cmd://git/log)
      manual page.
    quiet: Be quiet. Only print error messages.
    stdin: |-
      The list of patterns is read from standard input instead of from
      the argument list.
    z: |-
      When `--numstat` has been given, do not munge pathnames,
      but use a NUL-terminated machine-readable format.
      
      Without this option, pathnames with "unusual" characters are quoted as
      explained for the configuration variable `core.quotePath` (see
      [git-config](cmd://git/config)).
    merge-base: specify a merge-base for the merge
    messages: |-
      write any informational messages such as "Auto-merging <path>" or CONFLICT notices to the end of stdout
    no-messages: |-
      do not write any informational messages such as "Auto-merging <path>" or CONFLICT notices to the end of stdout
    strategy-option: pass merge strategy specific option through
    trivial-merge: do a trivial merge only
    write-tree: do a real merge instead of a trivial merge
