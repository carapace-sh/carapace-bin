# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: add
description: Create a worktree at <path> and checkout <commit-ish> into it
flags:
  --checkout: populate the new working tree
  --guess-remote: try to match the new branch name with a remote-tracking branch
  --lock: keep the new working tree locked
  --orphan: create unborn branch
  --reason=: reason for locking
  --relative-paths: use relative paths for worktrees
  --track: set up tracking mode
  -B=: create or reset a branch
  -b=: create a new branch
  -d, --detach: detach HEAD at named commit
  -f, --force: checkout <branch> even if already checked out in other worktree
  -q, --quiet: suppress progress reporting
documentation:
  flag:
    checkout: |-
      By default, `add` checks out _<commit-ish>_, however, `--no-checkout` can
      be used to suppress checkout in order to make customizations,
      such as configuring sparse-checkout. See "Sparse checkout"
      in [git-read-tree](cmd://git/read-tree).
    detach: |-
      With `add`, detach `HEAD` in the new worktree. See "DETACHED HEAD"
      in [git-checkout](cmd://git/checkout).
    force: |-
      By default, `add` refuses to create a new worktree when
      _<commit-ish>_ is a branch name and is already checked out by
      another worktree, or if _<path>_ is already assigned to some
      worktree but is missing (for instance, if _<path>_ was deleted
      manually). This option overrides these safeguards. To add a missing but
      locked worktree path, specify `--force` twice.

      `move` refuses to move a locked worktree unless `--force` is specified
      twice. If the destination is already assigned to some other worktree but is
      missing (for instance, if _<new-path>_ was deleted manually), then `--force`
      allows the move to proceed; use `--force` twice if the destination is locked.

      `remove` refuses to remove an unclean worktree unless `--force` is used.
      To remove a locked worktree, specify `--force` twice.
    guess-remote: |-
      With `worktree add <path>`, without _<commit-ish>_, instead
      of creating a new branch from `HEAD`, if there exists a tracking
      branch in exactly one remote matching the basename of _<path>_,
      base the new branch on the remote-tracking branch, and mark
      the remote-tracking branch as "upstream" from the new branch.

      This can also be set up as the default behaviour by using the
      `worktree.guessRemote` config option.
    lock: |-
      Keep the worktree locked after creation. This is the
      equivalent of `git worktree lock` after `git worktree add`,
      but without a race condition.
    quiet: With `add`, suppress feedback messages.
    track: |-
      When creating a new branch, if _<commit-ish>_ is a branch,
      mark it as "upstream" from the new branch.  This is the
      default if _<commit-ish>_ is a remote-tracking branch.  See
      `--track` in [git-branch](cmd://git/branch) for details.
    b: |-
      Show blank SHA-1 for boundary commits.  This can also
      be controlled via the `blame.blankBoundary` config option. c: `Use` the same output mode as [git-annotate](man://git-annotate/1) (Default: off).
    orphan: |-
      Create a new orphan branch named `<new-branch>`, started from
      the commit at which `git switch` or `git checkout` is invoked.
      The first commit made on this new branch will have no parent
      (it is a root commit), effectively starting a new, independent
      history. The index and working tree are adjusted as if you had
      previously run `git checkout <start-point>`, and then all
      entries are removed from the index, leaving only the files
      that were already in the working tree.
    B: create or reset a branch
    reason: reason for locking
    relative-paths: use relative paths for worktrees

