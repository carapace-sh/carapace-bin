# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: apply
description: Apply the stashed changes to the working tree
flags:
  --index: attempt to recreate the index
  --label-base=: label for the base in diff3 conflict markers
  --label-ours=: label for the upstream side in conflict markers
  --label-theirs=: label for the stashed side in conflict markers
  -q, --quiet: be quiet, only report errors
documentation:
  command: >-
    Like `pop`, but do not remove the state from the stash list.
    Unlike `pop`, `<stash>` may be any commit that looks like a commit
    created by `stash push` or `stash create`.
  flag:
    index: |-
      Apply the patch to both the index and the working tree (or
      merely check that it would apply cleanly to both if `--check` is
      in effect). Note that `--index` expects index entries and
      working tree copies for relevant paths to be identical (their
      contents and metadata such as file mode must match), and will
      raise an error if they are not, even if the patch would apply
      cleanly to both the index and the working tree in isolation.
    quiet: Be quiet. Only print error messages.
    label-base: label for the base in diff3 conflict markers
    label-ours: label for the upstream side in conflict markers
    label-theirs: label for the stashed side in conflict markers
