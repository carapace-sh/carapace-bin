# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: check-mailmap
description: Show canonical names and email addresses of contacts
group: low-level helper
flags:
  --mailmap-blob=: read mailmap from a blob
  --mailmap-file=: read mailmap from a file
  --stdin: also read contacts from stdin
documentation:
  command: |-
    For each `Name <user@host>*, `<user@host>*, or *user@host*
    from the command-line or standard input (when using `--stdin`), look up the
    person's canonical name and email address (see "Mapping Authors" below). If
    found, print them; otherwise print the input as-is.
  flag:
    stdin: |-
      The list of patterns is read from standard input instead of from
      the argument list.
    mailmap-blob: read mailmap from a blob
    mailmap-file: read mailmap from a file
