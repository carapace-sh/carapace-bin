# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: pack-refs
description: Pack heads and tags for efficient repository access
group: manipulator
flags:
  --all: pack everything
  --auto: auto-pack refs as needed
  --exclude=: references to exclude
  --include=: references to include
  --prune: prune loose refs (default)
documentation:
  command: |-
    Traditionally, tips of branches and tags (collectively known as
    'refs') were stored one file per ref in a (sub)directory
    under `$GIT_DIR/refs`
    directory.  While many branch tips tend to be updated often,
    most tags and some branch tips are never updated.  When a
    repository has hundreds or thousands of tags, this
    one-file-per-ref format both wastes storage and hurts
    performance.

    This command is used to solve the storage and performance
    problem by storing the refs in a single file,
    `$GIT_DIR/packed-refs`.  When a ref is missing from the
    traditional `$GIT_DIR/refs` directory hierarchy, it is looked
    up in this
    file and used if found.

    Subsequent updates to branches always create new files under
    `$GIT_DIR/refs` directory hierarchy.

    A recommended practice to deal with a repository with too many
    refs is to pack its refs with `--all` once, and
    occasionally run `git pack-refs`.  Tags are by
    definition stationary and are not expected to change.  Branch
    heads will be packed with the initial `pack-refs --all`, but
    only the currently active branch heads will become unpacked,
    and the next `pack-refs` (without `--all`) will leave them
    unpacked.
  flag:
    all: |-
      Update the index not only where the working tree has a file matching **\<pathspec\>**
      but also where the index already has an entry.
      This adds, modifies, and removes index entries to match the working tree.
      
      If no **\<pathspec\>** is given when `-A` option is used,
      all files in the entire working tree are updated
      (old versions of Git used to limit the update to the current directory and its subdirectories).
    exclude: |-
      These flags are passed to the *git apply* (see
      [git-apply](cmd://git/apply)) program that applies the patch.
      
      Valid \<action\> for the `--whitespace` option are: `nowarn`, `warn`, `fix`, `error`, and `error-all`.
    include: |-
      These flags are passed to the *git apply* (see
      [git-apply](cmd://git/apply)) program that applies the patch.
      
      Valid \<action\> for the `--whitespace` option are: `nowarn`, `warn`, `fix`, `error`, and `error-all`.
    prune: |-
      Before fetching, remove any remote-tracking references that no
      longer exist on the remote.  Tags are not subject to pruning
      if they are fetched only because of the default tag
      auto-following or due to a `--tags` option.  However, if tags
      are fetched due to an explicit refspec (either on the command
      line or in the remote configuration, for example if the remote
      was cloned with the `--mirror` option), then they are also
      subject to pruning. Supplying `--prune-tags` is a shorthand for
      providing the tag refspec.
      
      See the PRUNING section below for more details.
    auto: auto-pack refs as needed
