# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: read-tree
description: Reads tree information into the index
group: low-level manipulator
flags:
  --aggressive: resolve more merge cases internally
  --debug-unpack: debug unpack-trees
  --empty: instead of reading tree objects into the index, just empty it
  --exclude-per-directory=: read exclude patterns from <gitignore> in each directory
  --index-output=: write the resulting index in the named file
  --no-recurse-submodules: do not recurse submodules
  --no-sparse-checkout: disable sparse checkout support even if core.sparseCheckout is true
  --prefix=: read the contents of the named tree-ish under the directory at <prefix
  --recurse-submodules: recurse submodules
  --reset: same as -m, except that unmerged entries are discarded instead of failing
  --sparse-checkout: opposite of --no-sparse-checkout
  --trivial: restrict three-way merge by git read-tree to happen only if there is no file-level merging required
  -i: disable index check
  -m: perform a merge, not just a read
  -n, --dry-run: check if the command would error out
  -q, --quiet: suppress feedback messages
  -u: after a successful merge, update the files in the work tree with the result of the merge
  -v, --verbose: show the progress of checking files out
documentation:
  command: |-
    Reads the tree information given by <tree-ish> into the index,
    but does not actually *update* any of the files it "caches". (see:
    [git-checkout-index](cmd://git/checkout-index))

    Optionally, it can merge a tree into the index, perform a
    fast-forward (i.e. 2-way) merge, or a 3-way merge, with the `-m`
    flag.  When used with `-m`, the `-u` flag causes it to also update
    the files in the work tree with the result of the merge.

    Only trivial merges are done by `git read-tree` itself.  Only conflicting paths
    will be in an unmerged state when 'git read-tree' returns.
  flag:
    empty: |-
      How to handle commits that become empty after rebasing (because they contain a subset of already upstream changes). With `drop` (default), empty commits are removed. With `keep`, empty commits are retained. With `stop`, the rebase halts to let you choose. Note that commits which start empty are kept by default, and clean cherry-picks are detected and dropped as a preliminary step.
    m: |-
      Show diffs for merge commits in the default format. This is
      similar to `--diff-merges=on`, except `-m` will
      produce no output unless `-p` is given as well.
    no-recurse-submodules: |-
      Using `--recurse-submodules` will update the content of all active
      submodules according to the commit recorded in the superproject. If
      local modifications in a submodule would be overwritten the checkout
      will fail unless `-f` is used. If nothing (or `--no-recurse-submodules`)
      is used, submodules working trees will not be updated.
      Just like [git-submodule](cmd://git/submodule), this will detach `HEAD` of the
      submodule.
    prefix: |-
      Prepend &lt;prefix&gt;/ to paths in the archive. Can be repeated; its
      rightmost value is used for all tracked files. See below which value
      gets used by `--add-file`.
    recurse-submodules: |-
      THIS OPTION IS EXPERIMENTAL! Cause the current command to
      recurse into submodules if `submodule.propagateBranches` is
      enabled. See `submodule.propagateBranches` in
      [git-config](cmd://git/config). Currently, only branch creation is
      supported.
      
      When used in branch creation, a new branch _<branch-name>_ will be created
      in the superproject and all of the submodules in the superproject's
      _<start-point>_. In submodules, the branch will point to the submodule
      commit in the superproject's _<start-point>_ but the branch's tracking
      information will be set up based on the submodule's branches and remotes
      e.g. `git branch --recurse-submodules topic origin/main` will create the
      submodule branch "topic" that points to the submodule commit in the
      superproject's "origin/main", but tracks the submodule's "origin/main".
    dry-run: |-
      Don't actually add the file(s), just show if they exist and/or will
      be ignored.
    quiet: Be quiet. Only print error messages.
    verbose: Report progress to stderr.
    aggressive: resolve more merge cases internally
    debug-unpack: debug unpack-trees
    exclude-per-directory: read exclude patterns from <gitignore> in each directory
    i: disable index check
    index-output: write the resulting index in the named file
    no-sparse-checkout: disable sparse checkout support even if core.sparseCheckout is true
    reset: same as -m, except that unmerged entries are discarded instead of failing
    sparse-checkout: opposite of --no-sparse-checkout
    trivial: |-
      restrict three-way merge by git read-tree to happen only if there is no file-level merging required
    u: |-
      after a successful merge, update the files in the work tree with the result of the merge
