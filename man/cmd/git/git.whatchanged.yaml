# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: whatchanged
description: Show logs with difference each commit introduces
group: interrogator
flags:
  --abbrev-commit: show a prefix that names the object uniquely
  --abbrev=: show only a partial prefix
  --after=: show commits more recent than a specific date
  --all: pretend as if all the refs in refs/ are listed on the command line
  --all-match: limit output to ones matching all given --grep
  --alternate-refs: pretend as if all alternate ref tips are listed on the command line
  --anchored=*: generate a diff using the "anchored diff" algorithm
  --author=*: limit output to ones with matching author header
  --basic-regexp: consider the limiting patterns to be basic regular expressions
  --before=: show commits older than a specific date
  --binary: output a binary diff
  --boundary: output excluded boundary commits
  --branches?*: pretend as if all the refs in refs/heads are listed on the command line
  --cached: view the changes you staged in the index/cache
  --check: warn if changes introduce conflict markers or whitespace errors
  --cherry: a synonym for --right-only --cherry-mark --no-merges
  --cherry-mark: like --cherry-pick but mark commits rather than omitting them
  --cherry-pick: omit any commit that introduces the same change as another commit
  --children: print also the children of the commit
  --clear-decorations: clear all previously-defined decoration filters
  --color-moved-ws?: configure how whitespace is ignored when performing move detection
  --color-moved?: moved lines of code are colored differently
  --color-words=: equivalent to --word-diff=color plus (if a regex was specified)
  --color?: show colored diff
  --commit-header: overrides a previous --no-commit-header
  --committer=*: limit output to ones with matching committer header
  --compact-summary: output a condensed summary of extended header information
  --count: only print a number stating how many commits would have been listed
  --cumulative: synonym for --dirstat=cumulative
  --date=: date format
  --decorate-refs-exclude=*: do not decorate refs that match <pattern>
  --decorate-refs=*: only decorate refs that match <pattern>
  --decorate?: decorate options
  --default-prefix: use the default source and destination prefixes
  --diff-algorithm=: choose a diff algorithm
  --diff-filter=: filter files
  --dirstat-by-file=: synonym for --dirstat=files,param1,param2...
  --disk-usage?: suppress normal output and print disk usage
  --do-walk: overrides a previous --no-walk
  --dst-prefix=: show the given destination prefix instead of "b/"
  --encoding=: re-code the commit log message in given encoding
  --exclude-first-parent-only: for excluded commits follow only the first parent commit upon merge
  --exclude-hidden?: do not include refs that would be hidden
  --exclude-promisor-objects: prefilter object traversal at promisor boundary
  --exclude=*: do not include matching refs the next option would consider
  --exit-code: make the program exit with codes similar to diff(1)
  --expand-tabs=: perform a tab expansion
  --ext-diff: allow an external diff helper to be executed
  --filter-print-omitted: print a list of the objects omitted by the filter
  --filter-provided-objects: filter the list of explicitly provided objects
  --filter=: omit objects from the list of printed objects
  --find-copies-harder: inspect unmodified files as candidates for the source of copy
  --find-object=: look for differences that change the number of occurrences of the specified object
  --first-parent: for included commits follow only the first parent commit upon merge
  --follow: continue listing the history of a file beyond renames
  --format=: pretty-print the contents of the commit logs in a given format
  --full-index: show the full pre- and post-image blob object names
  --glob=*: pretend as if all matching refs are listed on the command line
  --graph: draw a text-based graphical representation of the commit history
  --graph-lane-limit=: limit the number of lanes in graph output
  --grep-reflog=*: limit output to ones with matching reflog entries
  --grep=*: limit output to ones with matching log message
  --header: print the contents of the commit in raw-format
  --histogram: generate a diff using the "histogram diff" algorithm
  --i-still-use-this: acknowledge deprecation and continue using whatchanged
  --ignore-blank-lines: ignore changes whose lines are all blank
  --ignore-cr-at-eol: ignore carriage-return at the end of line when doing a comparison
  --ignore-missing: pretend as if the bad input was not given
  --ignore-space-at-eol: ignore changes in whitespace at EOL
  --ignore-submodules=: ignore changes to submodules in the diff generation
  --in-commit-order: print tree and blob ids in order of the commits
  --indent-heuristic: enable the heuristic that shifts diff hunk boundaries to make patches easier to read
  --indexed-objects: pretend as if all trees and blobs used by the index are listed on the command line
  --inter-hunk-context=: show the context between diff hunks
  --invert-grep: limit output to ones with non-matching log message
  --ita-invisible-in-index: this option makes the entry appear as a new file
  --ita-visible-in-index: treat 'git add -N' entries as real in the index
  --left-only: list only commits on the left side of a symmetric difference
  --left-right: mark which side of a symmetric difference a commit is reachable from
  --line-prefix=: prepend an additional prefix to every line of output
  --mailmap: alias of --use-mailmap
  --max-age=: limit the commits output to specified time range
  --max-count-oldest=: limit the number of commits to output, picking the oldest N
  --max-depth=: maximum tree depth to recurse
  --max-parents=: show only commits which have at most that many parent commits
  --maximal-only: restrict output to commits not reachable from other commits in the range
  --merge: show refs that touch files having a conflict and don't exist on all heads to merge
  --merges: print only merge commits
  --min-age=: limit the commits output to specified time range
  --min-parents=: show only commits which have at least that many parent commits
  --minimal: spend extra time to make sure the smallest possible diff is produced
  --missing=: specify how missing objects are handled
  --name-only: show only names of changed files
  --name-status: show only names and status of changed files
  --no-abbrev: show the full 40-byte hexadecimal commit object name
  --no-abbrev-commit: show the full 40-byte hexadecimal commit object name
  --no-color: turn off colored diff
  --no-color-moved: turn off move detection
  --no-color-moved-ws: do not ignore whitespace when performing move detection
  --no-commit-header: suppress the header line containing "commit"
  --no-compact-summary: do not output a condensed summary of extended header information
  --no-exit-code: do not make the program exit with codes similar to diff(1)
  --no-expand-tabs: do not perform a tab expansion
  --no-ext-diff: disallow external diff drivers
  --no-filter: turn off any previous --filter= argument
  --no-find-copies-harder: do not inspect unmodified files as candidates for the source of copy
  --no-follow: do not continue listing the history of a file beyond renames
  --no-full-index: do not show the full pre- and post-image blob object names
  --no-indent-heuristic: disable the indent heuristic
  --no-index: compare paths on the file system
  --no-max-parents: reset max-parents limit
  --no-merges: do not print commits with more than one parent
  --no-min-parents: reset min-parents limit
  --no-notes: do not show notes
  --no-object-names: do not print the names of the object IDs that are found
  --no-prefix: do not show any source or destination prefix
  --no-quiet: do not disable all output of the program
  --no-relative: do not exclude changes outside the directory
  --no-rename-empty: whether to use empty blobs as rename source
  --no-renames: turn off rename detection
  --no-text: do not treat all files as text
  --no-textconv: disallow external text conversion filters to be run when comparing binary files
  --no-walk=: only show the given commits, but do not traverse their ancestors
  --not: reverses the meaning of the ^ prefix
  --notes?*: show the notes that annotate the commit
  --numstat: similar to --stat, but shows number of added and deleted lines in decimal notation
  --object-names: print the names of the object IDs that are found
  --objects: print the object IDs of any object referenced by the listed commits
  --objects-edge: similar to --objects, but also print the IDs of excluded commits
  --objects-edge-aggressive: similar to --objects-edge, but tries harder to find excluded commits
  --oneline: shorthand for "--pretty=oneline --abbrev-commit" used together
  --output-indicator-context=: specify the character used to indicate context lines in the generated patch
  --output-indicator-new=: specify the character used to indicate new lines in the generated patch
  --output-indicator-old=: specify the character used to indicate old lines in the generated patch
  --output=: output to a specific file instead of stdout
  --parents: print also the parents of the commit
  --patch-with-raw: synonym for -p --raw
  --patch-with-stat: synonym for -p --stat
  --patience: generate a diff using the "patience diff" algorithm
  --pickaxe-all: when -S or -G finds a change, show all the changes in that changeset
  --pickaxe-regex: treat the <string> given to -S as an extended POSIX regular expression to match
  --pretty=: pretty-print the contents of the commit logs in a given format
  --progress=: show progress reports on stderr as objects are considered
  --quiet: disable all output of the program
  --raw: generate the diff in raw format
  --reflog: pretend as if all reflog objects are listed on the command line
  --relative-date: synonym for --date=relative
  --relative=: exclude changes outside the directory
  --remotes?*: pretend as if all the refs in refs/remotes are listed on the command line
  --remove-empty: stop when a given path disappears from the tree
  --rename-empty: whether to use empty blobs as rename source
  --right-only: list only commits on the right side of a symmetric difference
  --rotate-to=: move the files before the named <file> to the end
  --shortstat: output only the last line of the --stat format
  --show-linear-break=: put a barrier in between branches in graph output
  --show-notes-by-default: show the default notes
  --show-signature: check the validity of a signed commit object
  --since-as-filter=: show all commits more recent than a specific date
  --since=: show commits more recent than a specific date
  --single-worktree: examine the current working tree only
  --skip-to=: discard the files before the named <file> from the output
  --skip=: skip number commits before starting to show the commit output
  --source: show source
  --src-prefix=: show the given source prefix instead of "a/"
  --staged: synonym for --cached (view the changes you staged)
  --stat-count=: generate diffstat with limited lines
  --stat-graph-width=: generate diffstat with a given graph width
  --stat-name-width=: generate diffstat with a given filename width
  --stat-width=: generate diffstat with a given width
  --stat=: generate a diffstat
  --stdin: read arguments from standard input as well
  --submodule=: specify how differences in submodules are shown
  --summary: output a condensed summary of extended header information
  --tags?*: pretend as if all the refs in refs/tags are listed on the command line
  --textconv=: allow external text conversion filters to be run when comparing binary files
  --timestamp: print the raw commit timestamp
  --unpacked: print the object IDs that are not in packs
  --until=: show commits older than a specific date
  --use-bitmap-index: try to speed up the traversal using the pack bitmap index
  --use-mailmap: use mail map file
  --word-diff-regex=: use <regex> to decide what a word is
  --word-diff?: show a word diff, using the <mode> to delimit changed words
  --ws-error-highlight=: highlight whitespace errors in the context, old or new lines of the diff
  "-0": omit diff output for unmerged entries
  -1, --base: compare with base
  -2, --ours: compare with our branch
  -3, --theirs: compare with their branch
  -B, --break-rewrites=: break complete rewrite changes into pairs of delete and create
  -C, --find-copies=: detect copies as well as renames
  -D, --irreversible-delete: omit the preimage for deletes
  -E, --extended-regexp: consider the limiting patterns to be extended regular expressions
  -F, --fixed-strings: consider the limiting patterns to be fixed strings
  -I, --ignore-matching-lines=*: ignore changes whose all lines match <regex>
  -L=*: trace the evolution of line range
  -M, --find-renames=: detect renames
  -O=: control the order in which files appear in the output
  -P, --perl-regexp: consider the limiting patterns to be Perl-compatible regular expressions
  -R: swap two inputs
  -S=: look for differences that change the number of occurrences of the specified string
  -U, --unified=: generate diffs with <n> lines of context instead of the usual three
  -W, --function-context: show whole surrounding functions of changes
  -X, --dirstat=: output the distribution of relative amount of changes for each sub-directory
  -a, --text: treat all files as text
  -b, --ignore-space-change: ignore changes in amount of whitespace
  -c, --cc: combined diff format for merge commits
  -g, --walk-reflogs: walk reflog entries from the most recent one to older ones
  -i, --regexp-ignore-case: match the regular expression case insensitive
  -l=: prevent rename/copy detection from running if the number of rename/copy targets exceeds the specified number
  -n, --max-count=: limit the number of commits to output
  -p, --patch: generate patch
  -s, --no-patch: suppress diff output
  -w, --ignore-all-space: ignore whitespace when comparing lines
  -z: do not munge pathnames and use NULs as output field terminators
documentation:
  command: |-
    Shows commit logs and diff output each commit introduces.

    New users are encouraged to use [git-log](cmd://git/log) instead.  The
    `whatchanged` command is essentially the same as [git-log](cmd://git/log)
    but defaults to showing the raw format diff output and skipping merges:

    ```
    git log --raw --no-merges
    ```

    The command is primarily kept for historical reasons; fingers of
    many people who learned Git long before `git log` was invented by
    reading the Linux kernel mailing list are trained to type it.

    ### Examples

    **git whatchanged -p v2.6.12.. include/scsi drivers/scsi**

    Show as patches the commits since version `v2.6.12` that changed
    any file in the include/scsi or drivers/scsi subdirectories

    **git whatchanged --since="2 weeks ago" -- gitk**

    Show the changes during the last two weeks to the file `gitk`.
    The "--" is necessary to avoid confusion with the *branch* named
    'gitk'
  flag:
    0: |-
      Specify compression level. Larger values allow the command to spend more
      time to compress to smaller size. Supported values are from `-0`
      (store-only) to `-9` (best ratio). Default is `-6` if not given.
    L: |-
      Annotate only the line range given by *&lt;start&gt;,&lt;end&gt;*, or by
      the function name regex *&lt;funcname&gt;*. May be specified multiple
      times. Overlapping ranges are allowed.
      
      *&lt;start&gt;* and *&lt;end&gt;* are optional. `-L <start>` or
      `-L <start>,` spans from *&lt;start&gt;* to end of file. `-L ,<end>`
      spans from start of file to *&lt;end&gt;*.
      
      *&lt;start&gt;* and *&lt;end&gt;* can take one of these forms:
      
      -   number
      
        If *&lt;start&gt;* or *&lt;end&gt;* is a number, it specifies an
        absolute line number (lines count from 1).
      
      -   `/regex/`
      
        This form will use the first line matching the given POSIX regex. If
        *&lt;start&gt;* is a regex, it will search from the end of the
        previous `-L` range, if any, otherwise from the start of file. If
        *&lt;start&gt;* is `^/regex/`, it will search from the start of
        file. If *&lt;end&gt;* is a regex, it will search starting at the
        line given by *&lt;start&gt;*.
      
      -   +offset or -offset
      
        This is only valid for *&lt;end&gt;* and will specify a number of
        lines before or after the line given by *&lt;start&gt;*.
      
      If `:<funcname>` is given in place of *&lt;start&gt;* and *&lt;end&gt;*,
      it is a regular expression that denotes the range from the first
      funcname line that matches *&lt;funcname&gt;*, up to the next funcname
      line. `:<funcname>` searches from the end of the previous `-L` range, if
      any, otherwise from the start of file. `^:<funcname>` searches from the
      start of file. The function names are determined in the same way as
      `git diff` works out patch hunk headers (see *Defining a custom
      hunk-header* in [gitattributes](man://gitattributes/5)).
    O: |-
      Control the order in which files appear in the output.
      This overrides the `diff.orderFile` configuration variable
      (see [git-config](cmd://git/config)).  To cancel `diff.orderFile`,
      use `-O/dev/null`.
      
      The output order is determined by the order of glob patterns in
      _<orderfile>_.
      All files with pathnames that match the first pattern are output
      first, all files with pathnames that match the second pattern (but not
      the first) are output next, and so on.
      All files with pathnames that do not match any pattern are output
      last, as if there was an implicit match-all pattern at the end of the
      file.
      If multiple pathnames have the same rank (they match the same pattern
      but no earlier patterns), their output order relative to each other is
      the normal order.
      
      _<orderfile>_ is parsed as follows:
    R: |-
      Swap two inputs; that is, show differences from index or
      on-disk file to tree contents.
    S: |-
      Use revisions from revs-file instead of calling
      [git-rev-list](cmd://git/rev-list).
    abbrev: |-
      Instead of using the default _7+1_ hexadecimal digits as the
      abbreviated object name, use _<m>+1_ digits, where _<m>_ is at
      least _<n>_ but ensures the commit object names are unique.
      Note that 1 column
      is used for a caret to mark the boundary commit.
    abbrev-commit: |-
      Instead of showing the full 40-byte hexadecimal commit object
      name, show a prefix that names the object uniquely.
      `--abbrev=<n>` (which also modifies diff output, if it is displayed)
      option can be used to specify the minimum length of the prefix.
      
      This should make `--pretty=oneline` a whole lot more readable for
      people using 80-column terminals.
    after: |-
      Show commits more recent than _<date>_.  As a special case,
      `today` means the last midnight.
    all: |-
      Update the index not only where the working tree has a file matching **\<pathspec\>**
      but also where the index already has an entry.
      This adds, modifies, and removes index entries to match the working tree.
      
      If no **\<pathspec\>** is given when `-A` option is used,
      all files in the entire working tree are updated
      (old versions of Git used to limit the update to the current directory and its subdirectories).
    all-match: |-
      When giving multiple pattern expressions combined with `--or`,
      this flag is specified to limit the match to files that
      have lines to match all of them.
    alternate-refs: |-
      Pretend as if all objects mentioned as ref tips of alternate
      repositories were listed on the command line. An alternate
      repository is any repository whose object directory is specified
      in `objects/info/alternates`.  The set of included objects may
      be modified by `core.alternateRefsCommand`, etc. See
      [git-config](cmd://git/config).
    anchored: |-
      Generate a diff using the "anchored diff" algorithm.
      
      This option may be specified more than once.
      
      If a line exists in both the source and destination, exists only once,
      and starts with _<text>_, this algorithm attempts to prevent it from
      appearing as a deletion or addition in the output. It uses the "patience
      diff" algorithm internally.
    author: |-
      Override the commit author. Specify an explicit author using the
      standard `A U Thor <author@example.com>` format. Otherwise _<author>_
      is assumed to be a pattern and is used to search for an existing
      commit by that author (i.e. `git rev-list --all -i --author=<author>`);
      the commit author is then copied from the first such commit found.
    basic-regexp: |-
      Use POSIX extended/basic regexp for patterns.  Default
      is to use basic regexp.
    before: Show commits older than _<date>_.
    binary: |-
      In addition to `--full-index`, output a binary diff that
      can be applied with `git-apply`.
      
      Implies `--patch`.
    boundary: |-
      Output excluded boundary commits. Boundary commits are
      prefixed with `-`.
    cached: |-
      Apply the patch to just the index, without touching the working
      tree. If `--check` is in effect, merely check that it would
      apply cleanly to the index entry.
    check: |-
      Instead of applying the patch, see if the patch is
      applicable to the current working tree and/or the index
      file and detects errors.  Turns off "apply".
    cherry: |-
      A synonym for `--right-only --cherry-mark --no-merges`; useful to
      limit the output to the commits on our side and mark those that
      have been applied to the other side of a forked history with
      `git log --cherry upstream...mybranch`, similar to
      `git cherry upstream mybranch`.
    cherry-mark: |-
      Like `--cherry-pick` (see below) but mark equivalent commits
      with `=` rather than omitting them, and inequivalent ones with `+`.
    cherry-pick: |-
      Omit any commit that introduces the same change as
      another commit on the `other` side* when the set of
      commits are limited with symmetric difference.
      
      For example, if you have two branches, `A` and `B`, a usual way
      to list all commits on only one side of them is with
      `--left-right` (see the example below in the description of
      the `--left-right` option). However, it shows the commits that were
      cherry-picked from the other branch (for example, `3rd on b* may be`
      cherry-picked from branch A). With this option, such pairs of commits are
      excluded from the output.
    children: |-
      Print also the children of the commit (in the form "commit child...").
      Also enables parent rewriting, see `History Simplification` above.
    commit-header: Overrides a previous `--no-commit-header`.
    committer: |-
      Limit the commits output to ones with author/committer
      header lines that match the _<pattern>_ regular
      expression.  With more than one `--author=<pattern>`,
      commits whose author matches any of the _<pattern>_ are
      chosen (similarly for multiple `--committer=<pattern>`).
    compact-summary: |-
      Output a condensed summary of extended header information such
      as file creations or deletions ("new" or "gone", optionally `+l`
      if it's a symlink) and mode changes (`+x` or `-x` for adding
      or removing executable bit respectively) in diffstat. The
      information is put between the filename part and the graph
      part. Implies `--stat`.
    count: Stop after showing _<count>_ refs.
    cumulative: Synonym for `--dirstat=cumulative`.
    date: Override the author date used in the commit.
    decorate-refs-exclude: |-
      For each candidate reference, do not use it for decoration if it
      matches any of the _<pattern>_ parameters given to
      `--decorate-refs-exclude` or if it doesn't match any of the
      _<pattern>_ parameters given to `--decorate-refs`.
      The `log.excludeDecoration` config option allows excluding refs from
      the decorations, but an explicit `--decorate-refs` pattern will
      override a match in `log.excludeDecoration`.
      
      If none of these options or config settings are given, then references are
      used as decoration if they match `HEAD`, `refs/heads/`, `refs/remotes/`,
      `refs/stash/`, or `refs/tags/. diff-algorithm: `Choose a diff algorithm. The variants are as follows:
    default-prefix: |-
      Use the default source and destination prefixes ("a/" and "b/").
      This overrides configuration variables such as `format.noprefix`,
      `diff.srcPrefix`, `diff.dstPrefix`, and `diff.mnemonicPrefix`
      (see [git-config](cmd://git/config)).
      
      Use the default source and destination prefixes ("a/" and "b/").
      This overrides configuration variables such as `diff.noprefix`,
      `diff.srcPrefix`, `diff.dstPrefix`, and `diff.mnemonicPrefix`
      (see [git-config](cmd://git/config)).
    diff-algorithm: |-
      Choose a diff algorithm. The variants are as follows:
    diff-filter: |-
      Select only files that are Added (`A`), Copied (`C`),
      Deleted (`D`), Modified (`M`), Renamed (`R`), have their
      type (i.e. regular file, symlink, submodule, ...) changed (`T`),
      are Unmerged (`U`), are
      Unknown (`X`), or have had their pairing Broken (`B`).
      Any combination of the filter characters (including none) can be used.
      When `*` (All-or-none) is added to the combination, all
      paths are selected if there is any file that matches
      other criteria in the comparison; if there is no file
      that matches other criteria, nothing is selected.
      
      Also, these upper-case letters can be downcased to exclude.  E.g.
      `--diff-filter=ad` excludes added and deleted paths.
      
      Note that not all diffs can feature all types. For instance, copied and
      renamed entries cannot appear if detection for those types is disabled.
    do-walk: |-
      Overrides a previous `--no-walk`.
      
      Commit Formatting
    dst-prefix: Show the given destination _<prefix>_ instead of "b/".
    encoding: |-
      Commit objects record the character encoding used for the log message
      in their encoding header; this option can be used to tell the
      command to re-code the commit log message in the encoding
      preferred by the user.  For non plumbing commands this
      defaults to UTF-8. Note that if an object claims to be encoded
      in `X` and we are outputting in `X`, we will output the object
      verbatim; this means that invalid sequences in the original
      commit may be copied to the output. Likewise, if iconv(3) fails
      to convert the commit, we will quietly output the original
      object verbatim.
    exclude: |-
      These flags are passed to the *git apply* (see
      [git-apply](cmd://git/apply)) program that applies the patch.
      
      Valid \<action\> for the `--whitespace` option are: `nowarn`, `warn`, `fix`, `error`, and `error-all`.
    exclude-first-parent-only: |-
      When finding commits to exclude (with a '^'), follow only
      the first parent commit upon seeing a merge commit.
      This can be used to find the set of changes in a topic branch
      from the point where it diverged from the remote branch, given
      that arbitrary merges can be valid topic branch changes.
    exclude-promisor-objects: |-
      (For internal use only.)  Prefilter object traversal at
      promisor boundary.  This is used with partial clone.  This is
      stronger than `--missing=allow-promisor` because it limits the
      traversal, rather than just silencing errors about missing
      objects.
    exit-code: |-
      Make the program exit with codes similar to `diff`(1).
      That is, it exits with 1 if there were differences and
      0 means no differences.
    expand-tabs: |-
      Perform a tab expansion (replace each tab with enough spaces
      to fill to the next display column that is a multiple of _<n>_)
      in the log message before showing it in the output.
      `--expand-tabs` is a short-hand for `--expand-tabs=8`, and
      `--no-expand-tabs` is a short-hand for `--expand-tabs=0`,
      which disables tab expansion.
      
      By default, tabs are expanded in pretty formats that indent the log
      message by 4 spaces (i.e.  `medium`, which is the default, `full`,
      and `fuller`).
    ext-diff: |-
      Allow an external diff helper to be executed. If you set an
      external diff driver with [gitattributes](man://gitattributes/5), you need
      to use this option with [git-log](cmd://git/log) and friends.
    filter: |-
      Use the partial clone feature and request that the server sends
      a subset of reachable objects according to a given object filter.
      When using `--filter`, the supplied _<filter-spec>_ is used for
      the partial clone filter.
      
      If `--filter=auto` is used the filter specification is determined
      automatically through the `promisor-remote` protocol (see
      [gitprotocol-v2](man://gitprotocol-v2/5)) by combining the filter specifications
      advertised by the server for the promisor remotes that the client
      accepts (see the `promisor.acceptFromServer` configuration option in
      [git-config](cmd://git/config)). This allows the server to suggest the optimal
      filter for the available promisor remotes.
      
      As with other filter specifications, the "auto" value is persisted in
      the configuration. This ensures that future fetches will continue to
      adapt to the server's current recommendation.
      
      For details on all other available filter specifications, see the
      `--filter=<filter-spec>` option in [git-rev-list](cmd://git/rev-list).
      
      For example, `--filter=blob:none` will filter out all blobs (file
      contents) until needed by Git. Also, `--filter=blob:limit=<size>` will
      filter out all blobs of size at least _<size>_.
    filter-print-omitted: |-
      Only useful with `--filter=`; prints a list of the objects omitted
      by the filter.  Object IDs are prefixed with a *~* character.
    filter-provided-objects: |-
      Filter the list of explicitly provided objects, which would otherwise
      always be printed even if they did not match any of the filters. Only
      useful with `--filter=`.
    find-copies-harder: |-
      For performance reasons, by default, `-C` option finds copies only
      if the original file of the copy was modified in the same
      changeset.  This flag makes the command
      inspect unmodified files as candidates for the source of
      copy.  This is a very expensive operation for large
      projects, so use it with caution.  Giving more than one
      `-C` option has the same effect.
    find-object: |-
      Look for differences that change the number of occurrences of
      the specified object. Similar to `-S`, just the argument is different
      in that it doesn't search for a specific string but for a specific
      object id.
      
      The object can be a blob or a submodule commit. It implies the `-t` option in
      `git-log` to also find trees.
    first-parent: |-
      Follow only the first parent commit upon seeing a merge commit.
      
      In detecting regressions introduced through the merging of a branch, the merge
      commit will be identified as introduction of the bug and its ancestors will be
      ignored.
      
      This option is particularly useful in avoiding false positives when a merged
      branch contained broken or non-buildable commits, but the merge itself was OK.
    follow: |-
      Continue listing the history of a file beyond renames
      (works only for a single file).
    format: |-
      Format of the resulting archive. Possible values are `tar`, `zip`,
      `tar.gz`, `tgz`, and any format defined using the configuration option
      `tar.<format>.command`. If `--format` is not given, and the output file
      is specified, the format is inferred from the filename if possible (e.g.
      writing to `foo.zip` makes the output to be in the `zip` format).
      Otherwise the output format is `tar`.
    full-index: |-
      Instead of the first handful of characters, show the full
      pre- and post-image blob object names on the "index"
      line when generating patch format output.
    glob: |-
      Pretend as if all the refs matching shell glob _<glob-pattern>_
      are listed on the command line as _<commit>_. Leading `refs/`,
      is automatically prepended if missing. If pattern lacks '?', '*',
      or '[', '/*' at the end is implied.
    graph: |-
      Draw a text-based graphical representation of the commit history
      on the left hand side of the output.  This may cause extra lines
      to be printed in between commits, in order for the graph history
      to be drawn properly.
      Cannot be combined with `--no-walk`.
      
      This enables parent rewriting, see `History Simplification` above.
      
      This implies the `--topo-order` option by default, but the
      `--date-order` option may also be specified.
    grep: |-
      Limit the commits output to ones with a log message that
      matches the _<pattern>_ regular expression.  With
      more than one `--grep=<pattern>`, commits whose message
      matches any of the _<pattern>_ are chosen (but see
      `--all-match`).
      
      When `--notes` is in effect, the message from the notes is
      matched as if it were part of the log message.
    grep-reflog: |-
      Limit the commits output to ones with reflog entries that
      match the _<pattern>_ regular expression. With
      more than one `--grep-reflog`, commits whose reflog message
      matches any of the given patterns are chosen.  It is an
      error to use this option unless `--walk-reflogs` is in use.
    header: |-
      Print the contents of the commit in raw-format; each record is
      separated with a NUL character.
    histogram: Generate a diff using the "histogram diff" algorithm.
    ignore-blank-lines: Ignore changes whose lines are all blank.
    ignore-cr-at-eol: Ignore carriage-return at the end of line when doing a comparison.
    ignore-missing: |-
      This option can only be used together with `--dry-run`. By using
      this option the user can check if any of the given files would
      be ignored, no matter if they are already present in the work
      tree or not.
    ignore-space-at-eol: Ignore changes in whitespace at EOL.
    in-commit-order: |-
      Print tree and blob ids in order of the commits. The tree
      and blob ids are printed after they are first referenced
      by a commit.
    indent-heuristic: |-
      Enable the heuristic that shifts diff hunk boundaries to make patches
      easier to read. This is the default.
    indexed-objects: |-
      Pretend as if all trees and blobs used by the index are listed
      on the command line.  Note that you probably want to use
      `--objects`, too.
    inter-hunk-context: |-
      Show the context between diff hunks, up to the specified _<number>_
      of lines, thereby fusing hunks that are close to each other.
      Defaults to `diff.interHunkContext` or 0 if the config option
      is unset.
    invert-grep: |-
      Limit the commits output to ones with a log message that do not
      match the _<pattern>_ specified with `--grep=<pattern>`.
    ita-invisible-in-index: |-
      By default entries added by `git add -N` appear as an existing
      empty file in `git diff` and a new file in `git diff --cached`.
      This option makes the entry appear as a new file in `git diff`
      and non-existent in `git diff --cached`. This option could be
      reverted with `--ita-visible-in-index`. Both options are
      experimental and could be removed in future.
    l: |-
      Show long rev (Default: off).
    left-right: |-
      Mark which side of a symmetric difference a commit is reachable from.
      Commits from the left side are prefixed with `<` and those from
      the right with `>`.  If combined with `--boundary`, those
      commits are prefixed with `-`.
      
      For example, if you have this topology:
      
      ```
        y---b---b  branch B
        / \ /
       /   .
       /   / \
      o---x---a---a  branch A
      ```
      
      you would get an output like this:
      
      ```
      $ git rev-list --left-right --boundary --pretty=oneline A...B
      
      >bbbbbbb... 3rd on b
      >bbbbbbb... 2nd on b
      <aaaaaaa... 3rd on a
      <aaaaaaa... 2nd on a
      -yyyyyyy... 1st on b
      -xxxxxxx... 1st on a
      ```
    line-prefix: Prepend an additional _<prefix>_ to every line of output.
    max-parents: |-
      Show only commits which have at least (or at most) that many parent
      commits. In particular, `--max-parents=1` is the same as `--no-merges`,
      `--min-parents=2` is the same as `--merges`.  `--max-parents=0`
      gives all root commits and `--min-parents=3` all octopus merges.
      
      `--no-min-parents` and `--no-max-parents` reset these limits (to no limit)
      again.  Equivalent forms are `--min-parents=0` (any commit has 0 or more
      parents) and `--max-parents=-1` (negative numbers denote no upper limit).
    merge: |-
      When switching branches,
      if you have local modifications to one or more files that
      are different between the current branch and the branch to
      which you are switching, the command refuses to switch
      branches in order to preserve your modifications in context.
      With this option, the conflicting local changes are
      automatically stashed before the switch and reapplied
      afterwards.  If the local changes do not overlap with the
      differences between branches, the switch proceeds without
      stashing.  If reapplying the stash results in conflicts, the
      entry is saved to the stash list.  Resolve the conflicts
      and run `git stash drop` when done, or clear the working
      tree (e.g. with `git reset --hard`) before running `git stash pop` later to re-apply your changes.
      
      When checking out paths from the index, this option lets you recreate
      the conflicted merge in the specified paths.  This option cannot be
      used when checking out paths from a tree-ish.
    merges: Print only merge commits. This is exactly the same as `--min-parents=2`.
    min-age: Limit the commits output to specified time range.
    minimal: |-
      Spend extra time to make sure the smallest possible
      diff is produced.
    missing: |-
      A debug option to help with future "partial clone" development.
      This option specifies how missing objects are handled.
      
      The form `--missing=error` requests that rev-list stop with an error if
      a missing object is encountered.  This is the default action.
      
      The form `--missing=allow-any` will allow object traversal to continue
      if a missing object is encountered.  Missing objects will silently be
      omitted from the results.
      
      The form `--missing=allow-promisor` is like `allow-any`, but will only
      allow object traversal to continue for EXPECTED promisor missing objects.
      Unexpected missing objects will raise an error.
      
      The form `--missing=print` is like `allow-any`, but will also print a
      list of the missing objects.  Object IDs are prefixed with a *?* character.
      
      The form `--missing=print-info` is like `print`, but will also print additional
      information about the missing object inferred from its containing object. The
      information is all printed on the same line with the missing object ID in the
      form: `?<oid> [<token>=<value>]...`. The `<token>=<value>` pairs containing
      additional information are separated from each other by a _SP_. The value is
      encoded in a token specific fashion, but _SP_ or _LF_ contained in value are always
      expected to be represented in such a way that the resulting encoded value does
      not have either of these two problematic bytes. Each `<token>=<value>` may be
      one of the following:
    name-only: |-
      Show only the name of each changed file in the post-image tree.
      The file names are often encoded in UTF-8.
      For more information see the discussion about encoding in the [git-log](cmd://git/log)
      manual page.
    name-status: |-
      Show only the name(s) and status of each changed file. See the description
      of the `--diff-filter` option on what the status letters mean.
      Just like `--name-only` the file names are often encoded in UTF-8.
    no-abbrev: Display the full sha1s in the output listing rather than abbreviating them.
    no-abbrev-commit: |-
      Show the full 40-byte hexadecimal commit object name. This negates
      `--abbrev-commit`, either explicit or implied by other options such
      as `--oneline`. It also overrides the `log.abbrevCommit` variable.
    no-color: |-
      Turn off branch colors, even when the configuration file gives the
      default to color output.
      Same as `--color=never`.
    no-color-moved: |-
      Turn off move detection. This can be used to override configuration
      settings. It is the same as `--color-moved=no`.
    no-color-moved-ws: |-
      Do not ignore whitespace when performing move detection. This can be
      used to override configuration settings. It is the same as
      `--color-moved-ws=no`.
    no-commit-header: |-
      Suppress the header line containing "commit" and the object ID printed before
      the specified format.  This has no effect on the built-in formats; only custom
      formats are affected.
    no-expand-tabs: |-
      Perform a tab expansion (replace each tab with enough spaces
      to fill to the next display column that is a multiple of _<n>_)
      in the log message before showing it in the output.
      `--expand-tabs` is a short-hand for `--expand-tabs=8`, and
      `--no-expand-tabs` is a short-hand for `--expand-tabs=0`,
      which disables tab expansion.
      
      By default, tabs are expanded in pretty formats that indent the log
      message by 4 spaces (i.e.  `medium`, which is the default, `full`,
      and `fuller`).
    no-ext-diff: Disallow external diff drivers.
    no-filter: Turn off any previous `--filter=` argument.
    no-indent-heuristic: Disable the indent heuristic.
    no-index: |-
      Search files in the current directory that is not managed by Git,
      or by ignoring that the current directory is managed by Git.  This
      is rather similar to running the regular `grep`(1) utility with its
      `-r` option specified, but with some additional benefits, such as
      using pathspec patterns to limit paths;  see the `pathspec` entry
      in [gitglossary](man://gitglossary/7) for more information.
      
      This option cannot be used together with `--cached` or `--untracked`.
      See also `grep.fallbackToNoIndex` in `CONFIGURATION` below.
    no-max-parents: |-
      Show only commits which have at least (or at most) that many parent
      commits. In particular, `--max-parents=1` is the same as `--no-merges`,
      `--min-parents=2` is the same as `--merges`.  `--max-parents=0`
      gives all root commits and `--min-parents=3` all octopus merges.
      
      `--no-min-parents` and `--no-max-parents` reset these limits (to no limit)
      again.  Equivalent forms are `--min-parents=0` (any commit has 0 or more
      parents) and `--max-parents=-1` (negative numbers denote no upper limit).
    no-merges: |-
      Do not print commits with more than one parent. This is
      exactly the same as `--max-parents=1`.
    no-notes: |-
      Do not show notes. This negates the above `--notes` option, by
      resetting the list of notes refs from which notes are shown.
      Options are parsed in the order given on the command line, so e.g.
      "`--notes --notes=foo --no-notes --notes=bar`" will only show notes
      from `refs/notes/bar`.
    no-object-names: |-
      Only useful with `--objects`; does not print the names of the object
      IDs that are found. This inverts `--object-names`. This flag allows
      the output to be more easily parsed by commands such as
      [git-cat-file](cmd://git/cat-file).
    no-prefix: Do not show any source or destination prefix.
    no-relative: |-
      When run from a subdirectory of the project, it can be
      told to exclude changes outside the directory and show
      pathnames relative to it with this option.  When you are
      not in a subdirectory (e.g. in a bare repository), you
      can name which subdirectory to make the output relative
      to by giving a _<path>_ as an argument.
      `--no-relative` can be used to countermand both `diff.relative` config
      option and previous `--relative`.
    no-rename-empty: Whether to use empty blobs as rename source.
    no-renames: |-
      Turn off rename detection, even when the configuration
      file gives the default to do so.
    no-textconv: |-
      Allow (or disallow) external text conversion filters to be run
      when comparing binary files. See [gitattributes](man://gitattributes/5) for
      details. Because textconv filters are typically a one-way
      conversion, the resulting diff is suitable for human
      consumption, but cannot be applied. For this reason, textconv
      filters are enabled by default only for [git-diff](cmd://git/diff) and
      [git-log](cmd://git/log), but not for [git-format-patch](cmd://git/format-patch) or
      diff plumbing commands.
    not: |-
      Specify how multiple patterns are combined using Boolean
      expressions.  `--or` is the default operator.  `--and` has
      higher precedence than `--or`.  `-e` has to be used for all
      patterns.
    numstat: |-
      Similar to `--stat`, but shows the number of added and
      deleted lines in decimal notation and the pathname without
      abbreviation, to make it more machine friendly.  For
      binary files, outputs two `-` instead of saying
      `0 0`.  Turns off "apply".
    object-names: |-
      Only useful with `--objects`; print the names of the object IDs
      that are found. This is the default behavior. Note that the
      "name" of each object is ambiguous, and mostly intended as a
      hint for packing objects. In particular: no distinction is made between
      the names of tags, trees, and blobs; path names may be modified
      to remove newlines; and if an object would appear multiple times
      with different names, only one name is shown.
    objects: |-
      Print the object IDs of any object referenced by the listed
      commits.  `--objects foo ^bar` thus means "send me
      all object IDs which I need to download if I have the commit
      object `bar` but not `foo`". See also `--object-names` below.
    objects-edge: |-
      Similar to `--objects`, but also print the IDs of excluded
      commits prefixed with a "`-`" character.  This is used by
      [git-pack-objects](cmd://git/pack-objects) to build a *thin* pack, which records
      objects in deltified form based on objects contained in these
      excluded commits to reduce network traffic.
    objects-edge-aggressive: |-
      Similar to `--objects-edge`, but it tries harder to find excluded
      commits at the cost of increased time.  This is used instead of
      `--objects-edge` to build *thin* packs for shallow repositories.
    oneline: |-
      This is a shorthand for `--pretty=oneline --abbrev-commit`
      used together.
    output: Write the archive to &lt;file&gt; instead of stdout.
    output-indicator-context: |-
      Specify the character used to indicate new, old or context
      lines in the generated patch. Normally they are `+`, `-` and
      ` ` respectively.
    parents: |-
      Print also the parents of the commit (in the form "commit parent...").
      Also enables parent rewriting, see 'History Simplification' above.
    patch-with-raw: Synonym for `-p --raw`.
    patch-with-stat: Synonym for `-p --stat`.
    patience: Generate a diff using the "patience diff" algorithm.
    pickaxe-all: |-
      When `-S` or `-G` finds a change, show all the changes in that
      changeset, not just the files that contain the change
      in _<string>_.
    pickaxe-regex: |-
      Treat the _<string>_ given to `-S` as an extended POSIX regular
      expression to match.
    progress: |-
      Enable progress reporting on the standard error stream even if
      not attached to a terminal. By default, progress status is
      reported only when it is attached. You can't use `--progress`
      together with `--porcelain` or `--incremental`.
    quiet: Be quiet. Only print error messages.
    raw: |-
      Generate the diff in raw format.
      
      This is the default.
      
      For each commit, show a summary of changes using the raw diff
      format. See the "RAW OUTPUT FORMAT" section of
      [git-diff](cmd://git/diff). This is different from showing the log
      itself in raw format, which you can achieve with
      `--format=raw`.
    reflog: |-
      Pretend as if all objects mentioned by reflogs are listed on the
      command line as _<commit>_.
    relative: |-
      When run from a subdirectory of the project, it can be
      told to exclude changes outside the directory and show
      pathnames relative to it with this option.  When you are
      not in a subdirectory (e.g. in a bare repository), you
      can name which subdirectory to make the output relative
      to by giving a _<path>_ as an argument.
      `--no-relative` can be used to countermand both `diff.relative` config
      option and previous `--relative`.
    relative-date: Synonym for `--date=relative`.
    remove-empty: Stop when a given path disappears from the tree.
    rename-empty: Whether to use empty blobs as rename source.
    right-only: |-
      List only commits on the respective side of a symmetric difference,
      i.e. only those which would be marked `<` resp. `>` by
      `--left-right`.
      
      For example, `--cherry-pick --right-only A...B` omits those
      commits from `B` which are in `A` or are patch-equivalent to a commit in
      `A`. In other words, this lists the `+` commits from `git cherry A B`.
      More precisely, `--cherry-pick --right-only --no-merges` gives the exact
      list.
    rotate-to: |-
      Discard the files before the named _<file>_ from the output
      (i.e. `skip to`), or move them to the end of the output
      (i.e. 'rotate to').  These options were invented primarily for the use
      of the `git difftool` command, and may not be very useful
      otherwise.
    shortstat: |-
      Output only the last line of the `--stat` format containing total
      number of modified files, as well as number of added and deleted
      lines.
    show-notes-by-default: |-
      Show the default notes unless options for displaying specific
      notes are given.
    show-signature: |-
      Check the validity of a signed commit object by passing the signature
      to `gpg --verify` and show the output.
    since-as-filter: |-
      Show all commits more recent than _<date>_. This visits
      all commits in the range, rather than stopping at the first commit which
      is older than _<date>_.
    single-worktree: |-
      By default, all working trees will be examined by the
      following options when there are more than one (see
      [git-worktree](cmd://git/worktree)): `--all`, `--reflog` and
      `--indexed-objects`.
      This option forces them to examine the current working tree
      only.
    skip: |-
      Skip the current patch.  This is only meaningful when
      restarting an aborted patch.
    source: |-
      Print out the ref name given on the command line by which each
      commit was reached.
    src-prefix: Show the given source _<prefix>_ instead of "a/".
    staged: |-
      Specify the restore location. If neither option is specified,
      by default the working tree is restored. Specifying `--staged`
      will only restore the index. Specifying both restores both.
    stat: |-
      Instead of applying the patch, output diffstat for the
      input.  Turns off "apply".
    stdin: |-
      The list of patterns is read from standard input instead of from
      the argument list.
    summary: |-
      Instead of applying the patch, output a condensed
      summary of information obtained from git diff extended
      headers, such as creations, renames, and mode changes.
      Turns off "apply".
    textconv: |-
      Allow (or disallow) external text conversion filters to be run
      when comparing binary files. See [gitattributes](man://gitattributes/5) for
      details. Because textconv filters are typically a one-way
      conversion, the resulting diff is suitable for human
      consumption, but cannot be applied. For this reason, textconv
      filters are enabled by default only for [git-diff](cmd://git/diff) and
      [git-log](cmd://git/log), but not for [git-format-patch](cmd://git/format-patch) or
      diff plumbing commands.
    timestamp: Print the raw commit timestamp.
    unpacked: |-
      Only useful with `--objects`; print the object IDs that are not
      in packs.
    use-bitmap-index: |-
      Try to speed up the traversal using the pack bitmap index (if
      one is available). Note that when traversing with `--objects`,
      trees and blobs will not have their associated path printed.
    use-mailmap: |-
      Use mailmap file to map author and committer names and email
      addresses to canonical real names and email addresses. See
      [git-shortlog](cmd://git/shortlog).
    word-diff-regex: |-
      Use _<regex>_ to decide what a word is, instead of considering
      runs of non-whitespace to be a word.  Also implies
      `--word-diff` unless it was already enabled.
      
      Every non-overlapping match of the
      _<regex>_ is considered a word.  Anything between these matches is
      considered whitespace and ignored(!) for the purposes of finding
      differences.  You may want to append `|[^[:space:]]` to your regular
      expression to make sure that it matches all non-whitespace characters.
      A match that contains a newline is silently truncated(!) at the
      newline.
      
      For example, `--word-diff-regex=.` will treat each character as a word
      and, correspondingly, show differences character by character.
      
      The regex can also be set via a diff driver or configuration option, see
      [gitattributes](man://gitattributes/5) or [git-config](cmd://git/config).  Giving it explicitly
      overrides any diff driver or configuration setting.  Diff drivers
      override configuration settings.
    ws-error-highlight: |-
      Highlight whitespace errors in the `context`, `old` or `new`
      lines of the diff.  Multiple values are separated by comma,
      `none` resets previous values, `default` reset the list to
      `new` and `all` is a shorthand for `old,new,context`.  When
      this option is not given, and the configuration variable
      `diff.wsErrorHighlight` is not set, only whitespace errors in
      `new` lines are highlighted. The whitespace errors are colored
      with `color.diff.whitespace`.
    z: |-
      When `--numstat` has been given, do not munge pathnames,
      but use a NUL-terminated machine-readable format.
      
      Without this option, pathnames with "unusual" characters are quoted as
      explained for the configuration variable `core.quotePath` (see
      [git-config](cmd://git/config)).
    base: |-
      Add prerequisite tree info to the patch series. The argument can be
      `auto` (use the current branch as the base), a commit object name,
      or a reference in `refs/notes/`. This option is useful when the
      patches need to be applied on top of a specific commit.
    cc: |-
      Produce dense combined diff output for merge commits.
      Shortcut for `--diff-merges=dense-combined -p`.
    color: |-
      Turn off branch colors, even when the configuration file gives the
      default to color output.
      Same as `--color=never`.
    exclude-hidden: |-
      Do not include refs that would be hidden by `git-fetch`,
      `git-receive-pack` or `git-upload-pack` by consulting the appropriate
      `fetch.hideRefs`, `receive.hideRefs` or `uploadpack.hideRefs`
      configuration along with `transfer.hideRefs` (see
      [git-config](cmd://git/config)). This option affects the next pseudo-ref option
      `--all` or `--glob` and is cleared after processing them.
    remotes: |-
      List or delete (if used with `-d`) the remote-tracking branches.
      Combine with `--list` to match the optional pattern(s).
    tags: |-
      Instead of using only the annotated tags, use any tag
      found in `refs/tags` namespace.  This option enables matching
      a lightweight (non-annotated) tag.
    theirs: |-
      When checking out paths from the index, check out stage #2
      (`ours`) or #3 (`theirs`) for unmerged paths.
      
      Note that during `git rebase` and `git pull --rebase`, `ours` and
      `theirs` may appear swapped; `--ours` gives the version from the
      branch the changes are rebased onto, while `--theirs` gives the
      version from the branch that holds your work that is being rebased.
      
      This is because `rebase` is used in a workflow that treats the
      history at the remote as the shared canonical one, and treats the
      work done on the branch you are rebasing as the third-party work to
      be integrated, and you are temporarily assuming the role of the
      keeper of the canonical history during the rebase.  As the keeper of
      the canonical history, you need to view the history from the remote
      as `ours` (i.e. "our shared canonical history"), while what you did
      on your side branch as `theirs` (i.e. "one contributor's work on top
      of it").
    no-compact-summary: do not output a condensed summary of extended header information
    no-exit-code: do not make the program exit with codes similar to diff(1)
    no-find-copies-harder: do not inspect unmodified files as candidates for the source of copy
    no-follow: do not continue listing the history of a file beyond renames
    no-full-index: do not show the full pre- and post-image blob object names
    no-quiet: do not disable all output of the program
    branches: pretend as if all the refs in refs/heads are listed on the command line
    break-rewrites: break complete rewrite changes into pairs of delete and create
    clear-decorations: clear all previously-defined decoration filters
    color-moved: moved lines of code are colored differently
    color-moved-ws: configure how whitespace is ignored when performing move detection
    color-words: equivalent to --word-diff=color plus (if a regex was specified)
    decorate: decorate options
    decorate-refs: only decorate refs that match <pattern>
    dirstat: output the distribution of relative amount of changes for each sub-directory
    dirstat-by-file: synonym for --dirstat=files,param1,param2...
    disk-usage: suppress normal output and print disk usage
    extended-regexp: consider the limiting patterns to be extended regular expressions
    find-copies: detect copies as well as renames
    find-renames: detect renames
    fixed-strings: consider the limiting patterns to be fixed strings
    function-context: show whole surrounding functions of changes
    graph-lane-limit: limit the number of lanes in graph output
    i-still-use-this: acknowledge deprecation and continue using whatchanged
    ignore-all-space: ignore whitespace when comparing lines
    ignore-matching-lines: ignore changes whose all lines match <regex>
    ignore-space-change: ignore changes in amount of whitespace
    ignore-submodules: ignore changes to submodules in the diff generation
    irreversible-delete: omit the preimage for deletes
    ita-visible-in-index: treat 'git add -N' entries as real in the index
    left-only: list only commits on the left side of a symmetric difference
    mailmap: alias of --use-mailmap
    max-age: limit the commits output to specified time range
    max-count: limit the number of commits to output
    max-count-oldest: limit the number of commits to output, picking the oldest N
    max-depth: maximum tree depth to recurse
    maximal-only: restrict output to commits not reachable from other commits in the range
    min-parents: show only commits which have at least that many parent commits
    no-min-parents: reset min-parents limit
    no-patch: suppress diff output
    no-text: do not treat all files as text
    no-walk: only show the given commits, but do not traverse their ancestors
    notes: show the notes that annotate the commit
    ours: compare with our branch
    output-indicator-new: specify the character used to indicate new lines in the generated patch
    output-indicator-old: specify the character used to indicate old lines in the generated patch
    patch: generate patch
    perl-regexp: consider the limiting patterns to be Perl-compatible regular expressions
    pretty: pretty-print the contents of the commit logs in a given format
    regexp-ignore-case: match the regular expression case insensitive
    show-linear-break: put a barrier in between branches in graph output
    since: show commits more recent than a specific date
    skip-to: discard the files before the named <file> from the output
    stat-count: generate diffstat with limited lines
    stat-graph-width: generate diffstat with a given graph width
    stat-name-width: generate diffstat with a given filename width
    stat-width: generate diffstat with a given width
    submodule: specify how differences in submodules are shown
    text: treat all files as text
    unified: generate diffs with <n> lines of context instead of the usual three
    until: show commits older than a specific date
    walk-reflogs: walk reflog entries from the most recent one to older ones
    word-diff: show a word diff, using the <mode> to delimit changed words
