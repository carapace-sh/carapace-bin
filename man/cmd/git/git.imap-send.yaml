# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: imap-send
description: Send a collection of patches from stdin to an IMAP folder
group: interaction
flags:
  --curl: use libcurl to communicate with the IMAP server
  --list: list all folders on the IMAP server
  --no-curl: do not use libcurl to communicate with the IMAP server
  -f, --folder=: specify the IMAP folder
  -q, --quiet: be more quiet
  -v, --verbose: be more verbose
documentation:
  flag:
    curl: |-
      Use libcurl to communicate with the IMAP server, unless tunneling
      into it.  Ignored if Git was built without the USE_CURL_FOR_IMAP_SEND
      option set.
    no-curl: |-
      Talk to the IMAP server using git's own IMAP routines instead of
      using libcurl.  Ignored if Git was built with the NO_OPENSSL option
      set.
    quiet: Be quiet.
    verbose: Be verbose.
    list: Show all available formats.
    folder: specify the IMAP folder

