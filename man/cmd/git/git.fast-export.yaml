# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: fast-export
description: Git data exporter
group: manipulator
flags:
  --anonymize: anonymize the contents of the repository while still retaining the shape of the history and stored tree
  --anonymize-map=*: convert token <from> to <to> in the anonymized output
  --data: opposite of --no-data
  --export-marks=: dumps the internal marks table to <file> when complete
  --fake-missing-tagger: fake a tagger to be able to fast-import the output
  --full-tree: this option will cause fast-export to issue a "deleteall" directive for each commit
  --import-marks-if-exists=: before processing any input, load the marks specified in <file> if it exists
  --import-marks=: before processing any input, load the marks specified in <file>
  --mark-tags: in addition to labelling blobs and commits with mark ids, also label tags
  --no-data: skip output of blob objects and instead refer to blobs via their original SHA-1 hash
  --progress=: insert progress statements every <n> objects
  --reencode=: specify how to handle encoding header in commit objects
  --reference-excluded-parents: refer to commits in the excluded range of history by their sha1sum
  --refspec: apply the specified refspec to each ref exported
  --show-original-ids: add an extra directive to the output for commits and blobs, original-oid <SHA1SUM>
  --signed-commits=: specify how to handle signed commits
  --signed-tags=: specify how to handle signed tags
  --tag-of-filtered-object=: specify how to handle tags whose tagged object is filtered out
  --use-done-feature: start the stream with a feature done stanza, and terminate it with a done command
  -C: perform copy detection
  -M: perform move detection
documentation:
  command: |-
    This program dumps the given revisions in a form suitable to be piped
    into 'git fast-import'.

    You can use it as a human-readable bundle replacement (see
    [git-bundle](cmd://git/bundle)), or as a format that can be edited before being
    fed to 'git fast-import' in order to do history rewrites (an ability
    relied on by tools like 'git filter-repo').
  flag:
    C: |-
      These flags are passed to the *git apply* (see
      [git-apply](cmd://git/apply)) program that applies the patch.
      
      Valid \<action\> for the `--whitespace` option are: `nowarn`, `warn`, `fix`, `error`, and `error-all`.
    M: |-
      Detect moved or copied lines within a file. When a commit moves or
      copies a block of lines (e.g. the original file has A and then B, and
      the commit changes it to B and then A), the traditional *blame*
      algorithm notices only half of the movement and typically blames the
      lines that were moved up (i.e. B) to the parent and assigns blame to the
      lines that were moved down (i.e. A) to the child commit. With this
      option, both groups of lines are blamed on the parent by running extra
      passes of inspection.
      
      &lt;num&gt; is optional but it is the lower bound on the number of
      alphanumeric characters that Git must detect as moving/copying within a
      file for it to associate those lines with the parent commit. The default
      value is 20.
    progress: |-
      Enable progress reporting on the standard error stream even if
      not attached to a terminal. By default, progress status is
      reported only when it is attached. You can't use `--progress`
      together with `--porcelain` or `--incremental`.
    anonymize: |-
      anonymize the contents of the repository while still retaining the shape of the history and stored tree
    anonymize-map: convert token <from> to <to> in the anonymized output
    data: opposite of --no-data
    export-marks: dumps the internal marks table to <file> when complete
    fake-missing-tagger: fake a tagger to be able to fast-import the output
    full-tree: |-
      this option will cause fast-export to issue a "deleteall" directive for each commit
    import-marks: before processing any input, load the marks specified in <file>
    import-marks-if-exists: before processing any input, load the marks specified in <file> if it exists
    mark-tags: in addition to labelling blobs and commits with mark ids, also label tags
    no-data: |-
      skip output of blob objects and instead refer to blobs via their original SHA-1 hash
    reencode: specify how to handle encoding header in commit objects
    reference-excluded-parents: refer to commits in the excluded range of history by their sha1sum
    refspec: apply the specified refspec to each ref exported
    show-original-ids: |-
      add an extra directive to the output for commits and blobs, original-oid <SHA1SUM>
    signed-commits: specify how to handle signed commits
    signed-tags: specify how to handle signed tags
    tag-of-filtered-object: specify how to handle tags whose tagged object is filtered out
    use-done-feature: |-
      start the stream with a feature done stanza, and terminate it with a done command
