# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: revert
description: Revert some existing commits
group: main
flags:
  --abort: cancel revert or cherry-pick sequence
  --cleanup=: 'how to strip spaces and #comments from message'
  --commit: opposite of --no-commit
  --continue: resume revert or cherry-pick sequence
  --no-edit: do not open the editor
  --no-gpg-sign: do not GPG-sign commits
  --no-rerere-autoupdate: do not update the index with reused conflict resolution
  --quit: end revert or cherry-pick sequence
  --reference: use the 'reference' format for merge commits
  --rerere-autoupdate: update the index with reused conflict resolution if possible
  --skip: skip current commit and continue
  --strategy=: merge strategy
  -S, --gpg-sign?: GPG-sign commits
  -X, --strategy-option=: option for merge strategy
  -e, --edit: edit the commit message
  -m, --mainline=: select mainline parent
  -n, --no-commit: don't automatically commit
  -s, --signoff: 'add Signed-off-by:'
documentation:
  flag:
    edit: |-
      With `--edit` (the default), `git revert` will open the editor
      before committing the revert so that the user can edit the commit
      message.
    gpg-sign: |-
      GPG-sign commits. The `keyid` argument is optional and defaults
      to the committer identity. `--no-gpg-sign` is useful to
      countermand both `commit.gpgSign` configuration variable and
      earlier `--gpg-sign`.
    mainline: |-
      When reverting a merge commit, specify the parent number (1-based)
      relative to which the revert should be considered. The revert
      undoes the changes introduced by the merge relative to this
      parent. See [git-merge](cmd://git/merge) for the format of the
      merge commit message, which lists the parent numbers.
    no-commit: |-
      Usually `git revert` will create a new commit that reverts the
      changes from the specified commit. With `--no-commit`, the
      changes are applied to the index and working tree but no commit
      is created, allowing you to make further modifications before
      committing.
    rerere-autoupdate: |-
      After the rerere mechanism reuses a recorded resolution on
      the current conflict to update the files in the working
      tree, allow it to also update the index with the result of
      resolution.  `--no-rerere-autoupdate` is a good way to
      double-check what [git-rerere](cmd://git/rerere) did and catch potential
      mismerges, before committing the result to the index with a
      separate [git-add](cmd://git/add).
    signoff: Add a `Signed-off-by` trailer at the end of the commit message.
    strategy: |-
      Use the given merge strategy. Should be one of `ort`, `ours`,
      `recursive`, `octopus`, or `subtree`. For further details, see
      the section "MERGE STRATEGIES" in [git-merge](cmd://git/merge).
      The `ort` strategy is the default.
    strategy-option: |-
      Pass the merge strategy-specific option through to the merge
      strategy. This implies `--merge` and, if no strategy has been
      specified, `-s ort`.
    abort: |-
      Restore the original branch and abort the patching operation.
      Revert the contents of files involved in the am operation to their
      pre-am state.
    cleanup: |-
      Determine how the supplied commit message should be
      cleaned up before committing.  The `<mode>` can be `strip`,
      `whitespace`, `verbatim`, `scissors` or `default`.
    commit: |-
      Perform the merge and commit the result. This option can
      be used to override `--no-commit`.
      
      Only useful when merging.
      
      With `--no-commit` perform the merge and stop just before creating
      a merge commit, to give the user a chance to inspect and further
      tweak the merge result before committing.
      
      Note that fast-forward updates do not create a merge commit and
      therefore there is no way to stop those merges with `--no-commit`.
      Thus, if you want to ensure your branch is not changed or updated
      by the merge command, use `--no-ff` with `--no-commit`.
    continue: |-
      After a patch failure (e.g. attempting to apply conflicting patch),
      the user has applied it by hand and the index file stores the result
      of the application. Make a commit using the authorship and commit
      log extracted from the e-mail message and the current index file,
      and continue.
    no-edit: |-
      Use the selected commit message without launching an editor.
      For example, `git commit --amend --no-edit` amends a commit
      without changing its commit message.
    no-gpg-sign: |-
      GPG-sign commits. The _<key-id>_ is optional and
      defaults to the committer identity; if specified, it must be
      stuck to the option without a space. `--no-gpg-sign` is useful to
      countermand both `commit.gpgSign` configuration variable, and
      earlier `--gpg-sign`.
    no-rerere-autoupdate: |-
      After the rerere mechanism reuses a recorded resolution on
      the current conflict to update the files in the working
      tree, allow it to also update the index with the result of
      resolution.  `--no-rerere-autoupdate` is a good way to
      double-check what [git-rerere](cmd://git/rerere) did and catch potential
      mismerges, before committing the result to the index with a
      separate [git-add](cmd://git/add).
    quit: |-
      Abort the patching operation but keep `HEAD` and the index
      untouched.
    reference: |-
      Pass the local _<repository>_ as a reference when cloning the submodule.
      This option is only valid for `add` and `update` commands.
      These commands sometimes need to clone a remote repository. In this case,
      this option will be passed to the [git-clone](cmd://git/clone) command.
      
      NOTE: Do *not* use this option unless you have read the note
      for [git-clone](cmd://git/clone)'s `--reference`, `--shared`, and `--dissociate`
      options carefully.
    skip: |-
      Skip the current patch.  This is only meaningful when
      restarting an aborted patch.

