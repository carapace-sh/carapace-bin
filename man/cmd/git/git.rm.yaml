# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: rm
description: Remove files from the working tree and from the index
group: main
flags:
  --cached: only remove from the index
  --ignore-unmatch: exit with a zero status even if nothing matched
  --pathspec-file-nul: pathspec elements are separated with NUL character
  --pathspec-from-file=: read pathspec from file
  --sparse: allow removing files outside sparse-checkout cone
  -f, --force: override the up-to-date check
  -n, --dry-run: dry run
  -q, --quiet: do not list removed files
  -r: allow recursive removal
documentation:
  flag:
    cached: |-
      Use this option to unstage and remove paths only from the index.
      Working tree files, whether modified or not, will be
      left alone.
    dry-run: |-
      Don't actually remove any file(s).  Instead, just show
      if they exist in the index and would otherwise be removed
      by the command.
    force: Override the up-to-date check.
    ignore-unmatch: Exit with a zero status even if no files matched.
    pathspec-file-nul: |-
      Only meaningful with `--pathspec-from-file`. Pathspec elements are
      separated with _NUL_ character and all other characters are taken
      literally (including newlines and quotes).
    pathspec-from-file: |-
      Pathspec is passed in _<file>_ instead of  args. If
      _<file>_ is exactly `-` then standard input is used. Pathspec
      elements are separated by _LF_ or _CR_/_LF_. Pathspec elements can be
      quoted as explained for the configuration variable `core.quotePath`
      (see [git-config](cmd://git/config)). See also `--pathspec-file-nul` and
      global `--literal-pathspecs`.
    quiet: |-
      `git rm` normally outputs one line (in the form of an `rm` command)
      for each file removed. This option suppresses that output.
    r: |-
      Allow recursive removal when a leading directory name is
          given.
    sparse: |-
      Employ a sparse-checkout, with only files in the toplevel
      directory initially being present.  The
      [git-sparse-checkout](cmd://git/sparse-checkout) command can be used to grow the
      working directory as needed.

