    keep-true-parents: keep true parents even with grafts
    keep-unreachable: |-
      objects unreachable from the refs in named packs are added to the resulting pack
    max-pack-size: split the output packfile into multiple independent packfiles
    name-hash-version: name hash version for pack index
    no-reuse-delta: do not reuse existing deltas
    no-reuse-object: do not reuse existing object data at all
    non-empty: only create a packed archive if it would contain at least one object
    pack-loose-unreachable: pack unreachable loose objects
    path-walk: sort objects by path for better compression
    reuse-delta: reuse existing deltas
    reuse-object: reuse existing object data
    revs: read the revision arguments from the standard input
    shallow: optimize a pack that will be provided to a client with a shallow repository
