# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: checkout-index
description: Copy files from the index to the working tree
group: low-level manipulator
flags:
  --create: opposite of --no-create
  --ignore-skip-worktree-bits: do not skip files with skip-worktree set
  --prefix=: when creating files, prepend <string>
  --stage=: copy out the files from named stage
  --stdin: read list of paths from the standard input
  --temp: write the content to temporary files
  -a, --all: check out all files in the index
  -f, --force: force overwrite of existing files
  -n, --no-create: don't checkout new files
  -q, --quiet: no warning for existing files and files not in index
  -u, --index: update stat information in the index file
  -z: paths are separated with NUL character
documentation:
  command: |-
    Copies all listed files from the index to the working directory
    (not overwriting existing files).
  flag:
    ignore-skip-worktree-bits: |-
      In sparse checkout mode, `git checkout -- <path>...` would
      update only entries matched by _<paths>_ and sparse patterns
      in `$GIT_DIR/info/sparse-checkout`. This option ignores
      the sparse patterns and adds back any files in `<path>...`.
    prefix: |-
      Prepend &lt;prefix&gt;/ to paths in the archive. Can be repeated; its
      rightmost value is used for all tracked files. See below which value
      gets used by `--add-file`.
    stdin: |-
      The list of patterns is read from standard input instead of from
      the argument list.
    z: |-
      When `--numstat` has been given, do not munge pathnames,
      but use a NUL-terminated machine-readable format.
      
      Without this option, pathnames with "unusual" characters are quoted as
      explained for the configuration variable `core.quotePath` (see
      [git-config](cmd://git/config)).
    all: |-
      Update the index not only where the working tree has a file matching **\<pathspec\>**
      but also where the index already has an entry.
      This adds, modifies, and removes index entries to match the working tree.
      
      If no **\<pathspec\>** is given when `-A` option is used,
      all files in the entire working tree are updated
      (old versions of Git used to limit the update to the current directory and its subdirectories).
    force: |-
      Allow adding otherwise ignored files. The option is also used when
      `submodule.<name>.ignore=all` is set, but you want to stage an
      update of the submodule. The `path` to the submodule must be explicitly
      specified.
    index: |-
      Apply the patch to both the index and the working tree (or
      merely check that it would apply cleanly to both if `--check` is
      in effect). Note that `--index` expects index entries and
      working tree copies for relevant paths to be identical (their
      contents and metadata such as file mode must match), and will
      raise an error if they are not, even if the patch would apply
      cleanly to both the index and the working tree in isolation.
    quiet: Be quiet. Only print error messages.
    create: opposite of --no-create
    no-create: don't checkout new files
    stage: copy out the files from named stage
    temp: write the content to temporary files
