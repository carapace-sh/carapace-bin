# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: list
description: List references
flags:
  --color=: respect any colors specified in the --format option
  --contains=: only list refs which contain the specified commit
  --count=: limit refs
  --exclude=*: only list refs which do not match any excluded pattern(s)
  --format=: a string that interpolates %(fieldname) from a ref being shown
  --ignore-case: sorting and filtering refs are case insensitive
  --include-root-refs: also include HEAD ref and pseudorefs
  --merged=: only list refs whose tips are reachable from the specified commit
  --no-contains=: only list refs which don't contain the specified commit
  --no-merged=: only list refs whose tips are not reachable from the specified commit
  --omit-empty: do not print a newline after formatted refs
  --perl: quote strings for perl
  --points-at=: only list refs which points at the given object
  --python: quote strings for python
  --shell: quote strings for shell
  --sort=*: field name to sort on
  --start-after=: start iteration after the provided marker
  --stdin: read reference patterns from stdin
  --tcl: quote strings for tcl
documentation:
  command: List references in the repository with support for filtering, formatting, and sorting. This subcommand is an alias for [git-for-each-ref](cmd://git/for-each-ref) and offers identical functionality.
  flag:
    color: |-
      Turn off branch colors, even when the configuration file gives the
      default to color output.
      Same as `--color=never`.
    contains: |-
      Instead of finding the tag that predates the commit, find
      the tag that comes after the commit, and thus contains it.
      Automatically implies `--tags`.
    count: Stop after showing _<count>_ refs.
    exclude: |-
      These flags are passed to the *git apply* (see
      [git-apply](cmd://git/apply)) program that applies the patch.
      
      Valid \<action\> for the `--whitespace` option are: `nowarn`, `warn`, `fix`, `error`, and `error-all`.
    format: |-
      Format of the resulting archive. Possible values are `tar`, `zip`,
      `tar.gz`, `tgz`, and any format defined using the configuration option
      `tar.<format>.command`. If `--format` is not given, and the output file
      is specified, the format is inferred from the filename if possible (e.g.
      writing to `foo.zip` makes the output to be in the `zip` format).
      Otherwise the output format is `tar`.
    ignore-case: Sorting and filtering branches are case insensitive.
    omit-empty: |-
      Do not print a newline after formatted refs where the format expands
      to the empty string.
    points-at: Only list refs which points at the given object.
    sort: |-
      Sort based on _<key>_. Prefix `-` to sort in descending
      order of the value. You may use the `--sort=<key>` option
      multiple times, in which case the last key becomes the primary
      key. The keys supported are the same as those in [git-for-each-ref](cmd://git/for-each-ref).
      Sort order defaults to the value configured for the
      `branch.sort` variable if it exists, or to sorting based on the
      full refname (including `refs/...` prefix). This lists
      detached `HEAD` (if present) first, then local branches and
      finally remote-tracking branches. See [git-config](cmd://git/config).
    stdin: |-
      The list of patterns is read from standard input instead of from
      the argument list.
    tcl: |-
      If given, strings that substitute `%(fieldname)`
      placeholders are quoted as string literals suitable for
      the specified host language.  This is meant to produce
      a scriptlet that can directly be "eval"ed.
    no-contains: only list refs which don't contain the specified commit
    include-root-refs: also include HEAD ref and pseudorefs
    merged: only list refs whose tips are reachable from the specified commit
    no-merged: only list refs whose tips are not reachable from the specified commit
    perl: quote strings for perl
    python: quote strings for python
    shell: quote strings for shell
    start-after: start iteration after the provided marker
