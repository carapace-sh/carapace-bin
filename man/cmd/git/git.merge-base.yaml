# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: merge-base
description: Find as good common ancestors as possible for a merge
group: low-level interrogator
flags:
  --fork-point: find the point at which a branch forked from another branch <ref>
  --independent: print a minimal subset of the supplied commits with the same ancestors
  --is-ancestor: check if the first <commit> is an ancestor of the second <commit>
  --octopus: compute the best common ancestors of all supplied commits
  -a, --all: output all merge bases for the commits
documentation:
  command: |-
    'git merge-base' finds the best common ancestor(s) between two commits to use
    in a three-way merge.  One common ancestor is 'better' than another common
    ancestor if the latter is an ancestor of the former.  A common ancestor
    that does not have any better common ancestor is a 'best common
    ancestor', i.e. a 'merge base'.  Note that there can be more than one
    merge base for a pair of commits.
  flag:
    fork-point: |-
      Use reflog to find a better common ancestor between `<upstream>`
      and `<branch>` when calculating which commits have been
      introduced by `<branch>`.
      
      When `--fork-point` is active, `fork_point` will be used instead of
      `<upstream>` to calculate the set of commits to rebase, where
      `fork_point` is the result of `git merge-base --fork-point <upstream> <branch>` command (see [git-merge-base](cmd://git/merge-base)).  If `fork_point`
      ends up being empty, the `<upstream>` will be used as a fallback.
      
      If `<upstream>` or `--keep-base` is given on the command line, then
      the default is `--no-fork-point`, otherwise the default is
      `--fork-point`. See also `rebase.forkpoint` in [git-config](cmd://git/config).
      
      If your branch was based on `<upstream>` but `<upstream>` was rewound and
      your branch contains commits which were dropped, this option can be used
      with `--keep-base` in order to drop those commits from your branch.
    all: |-
      Update the index not only where the working tree has a file matching **\<pathspec\>**
      but also where the index already has an entry.
      This adds, modifies, and removes index entries to match the working tree.
      
      If no **\<pathspec\>** is given when `-A` option is used,
      all files in the entire working tree are updated
      (old versions of Git used to limit the update to the current directory and its subdirectories).
    independent: print a minimal subset of the supplied commits with the same ancestors
    is-ancestor: check if the first <commit> is an ancestor of the second <commit>
    octopus: compute the best common ancestors of all supplied commits
