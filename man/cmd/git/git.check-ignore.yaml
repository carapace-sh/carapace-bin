# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: check-ignore
description: Debug gitignore / exclude files
group: low-level helper
flags:
  --index: opposite of --no-index
  --no-index: ignore index when checking
  --stdin: read file names from stdin
  -n, --non-matching: show non-matching input paths
  -q, --quiet: suppress progress reporting
  -v, --verbose: be verbose
  -z: terminate input and output records by a NUL character
documentation:
  command: |-
    For each pathname given via the command-line or from a file via
    `--stdin`, check whether the file is excluded by .gitignore (or other
    input files to the exclude mechanism) and output the path if it is
    excluded.

    By default, tracked files are not shown at all since they are not
    subject to exclude rules; but see `--no-index`.
  flag:
    index: |-
      Apply the patch to both the index and the working tree (or
      merely check that it would apply cleanly to both if `--check` is
      in effect). Note that `--index` expects index entries and
      working tree copies for relevant paths to be identical (their
      contents and metadata such as file mode must match), and will
      raise an error if they are not, even if the patch would apply
      cleanly to both the index and the working tree in isolation.
    no-index: |-
      Search files in the current directory that is not managed by Git,
      or by ignoring that the current directory is managed by Git.  This
      is rather similar to running the regular `grep`(1) utility with its
      `-r` option specified, but with some additional benefits, such as
      using pathspec patterns to limit paths;  see the `pathspec` entry
      in [gitglossary](man://gitglossary/7) for more information.
      
      This option cannot be used together with `--cached` or `--untracked`.
      See also `grep.fallbackToNoIndex` in `CONFIGURATION` below.
    stdin: |-
      The list of patterns is read from standard input instead of from
      the argument list.
    z: |-
      When `--numstat` has been given, do not munge pathnames,
      but use a NUL-terminated machine-readable format.
      
      Without this option, pathnames with "unusual" characters are quoted as
      explained for the configuration variable `core.quotePath` (see
      [git-config](cmd://git/config)).
    quiet: Be quiet. Only print error messages.
    verbose: Report progress to stderr.
    non-matching: show non-matching input paths
