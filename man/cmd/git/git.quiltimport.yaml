# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: quiltimport
description: Applies a quilt patchset onto the current branch
group: interaction
flags:
  --author=: author name and email address for patches without any
  --keep-non-patch: pass -b to git mailinfo
  --patches=: path to the quilt patches
  --series=: path to the quilt series file
  -n, --dry-run: dry run
documentation:
  command: |-
    Applies a quilt patchset onto the current Git branch, preserving
    the patch boundaries, patch order, and patch descriptions present
    in the quilt patchset.

    For each patch the code attempts to extract the author from the
    patch description.  If that fails it falls back to the author
    specified with --author.  If the --author flag was not given
    the patch description is displayed and the user is asked to
    interactively enter the author of the patch.

    If a subject is not found in the patch description the patch name is
    preserved as the 1 line subject in the Git description.
  flag:
    author: |-
      Override the commit author. Specify an explicit author using the
      standard `A U Thor <author@example.com>` format. Otherwise _<author>_
      is assumed to be a pattern and is used to search for an existing
      commit by that author (i.e. `git rev-list --all -i --author=<author>`);
      the commit author is then copied from the first such commit found.
    keep-non-patch: |-
      Pass `-b` flag to *git mailinfo* (see
      [git-mailinfo](cmd://git/mailinfo)).
    dry-run: |-
      Don't actually add the file(s), just show if they exist and/or will
      be ignored.
    patches: path to the quilt patches
    series: path to the quilt series file
