# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: repack
description: Pack unpacked objects in a repository
group: manipulator
flags:
  --combine-cruft-below-size=: combine cruft packs smaller than this size
  --cruft: same as -a, pack unreachable cruft objects separately
  --cruft-expiration=: with --cruft, expire objects older than this
  --depth=: limits the maximum delta depth
  --drop-filtered: delete filtered out objects (requires --filter)
  --dry-run: only show which objects would be dropped
  --expire-to=: pack prefix to store a pack containing pruned objects
  --filter-to=: pack prefix to store filtered-out objects
  --filter=*: object filtering
  --keep-pack=*: do not repack this pack
  --max-cruft-size=: maximum size of each cruft pack
  --max-pack-size=: maximum size of each packfile
  --name-hash-version=: name hash version for pack index
  --pack-kept-objects: repack objects in packs marked with .keep
  --path-walk: pass --path-walk to git-pack-objects
  --threads=: limits the maximum number of threads
  --unpack-unreachable=: with -A, do not loosen objects older than this
  --window-memory=: same as the above, but limit memory size instead of entries count
  --window=: size of the window used for delta compression
  -A: same as -a, and turn unreachable objects loose
  -F: pass --no-reuse-object to git-pack-objects
  -a: pack everything in a single pack
  -b, --write-bitmap-index: write bitmap index
  -d: remove redundant packs, and run git-prune-packed
  -f: pass --no-reuse-delta to git-pack-objects
  -g, --geometric=: find a geometric progression with factor <N>
  -i, --delta-islands: pass --delta-islands to git-pack-objects
  -k, --keep-unreachable: with -a, repack unreachable objects
  -l, --local: pass --local to git-pack-objects
  -m, --write-midx?: write a multi-pack index of the resulting packs
  -n: do not run git-update-server-info
  -q, --quiet: be quiet
documentation:
  command: |-
    This command is used to combine all objects that do not currently
    reside in a "pack", into a pack.  It can also be used to re-organize
    existing packs into a single, more efficient pack.

    A pack is a collection of objects, individually compressed, with
    delta compression applied, stored in a single file, with an
    associated index file.

    Packs are used to reduce the load on mirror systems, backup
    engines, disk storage, etc.
  flag:
    a: |-
      Instead of incrementally packing the unpacked objects,
      pack everything referenced into a single pack.
      Especially useful when packing a repository that is used
      for private development. Use
      with `-d`.  This will clean up the objects that `git prune`
      leaves behind, but `git fsck --full --dangling` shows as
      dangling.

      Note that users fetching over dumb protocols will have to fetch the
      whole new pack in order to get any contained object, no matter how many
      other objects in that pack they already have locally.
    depth: |-
      These options affect how the objects contained in the pack are
      stored using delta compression. `--depth` limits the maximum delta
      depth; making it too deep affects the performance on the unpacker
      side, because delta data needs to be applied that many times to get
      to the necessary object. The default value for `--window` is 10 and
      `--depth` is 50. The maximum depth is 4095.
    drop-filtered: |-
      Delete the local objects that match the `--filter` specification
      instead of keeping them in a separate packfile, reclaiming the
      disk space they occupy. This is intended for partial clones,
      where the filtered objects are promisor objects that remain
      recoverable from the promisor remote and are lazily re-fetched
      on demand when they are next needed.

      Only large blobs are supported for now, so `--filter=blob:limit=<n>`
      is currently the only accepted filter. Because dropped objects must be
      recoverable, this option requires a promisor remote to be configured
      and refuses to run otherwise.

      As a convenience, since dropped objects remain recoverable by lazy fetch,
      `--drop-filtered` refuses to run while another operation
      (merge, rebase, am, cherry-pick, revert, or bisect) is in progress, to
      avoid a surprising network fetch mid-operation, and refuses to drop any
      blob that the current index references, since such a blob would only be
      lazily re-fetched by the next command that inspects the working tree.
      These checks are skipped in bare repositories, which have neither a
      working tree nor an index.
    dry-run: |-
      Only meaningful with `--drop-filtered`. List the objects that
      would be dropped, one object ID per line, without rebuilding any
      pack or deleting anything.
    f: |-
      Pass the `--no-reuse-delta` option to `git-pack-objects`.
    filter: |-
      Remove objects matching the filter specification from the
      resulting packfile and put them into a separate packfile. Note
      that objects used in the working directory are not filtered
      out. So for the split to fully work, it's best to perform it
      in a bare repo and to use the `-a` and `-d` options along with
      this option.  Also `--no-write-bitmap-index` (or the
      `repack.writebitmaps` config option set to `false`) should be
      used otherwise writing bitmap index will fail, as it supposes
      a single packfile containing all the objects. See
      [git-rev-list](cmd://git/rev-list) for valid `<filter-spec>` forms.
    n: |-
      Do not update the server information with
      [git-update-server-info](cmd://git/update-server-info).  This option skips
      updating local catalog files needed to publish
      this repository (or a direct copy of it)
      over HTTP or FTP.
    local: |-
      Pass the `--local` option to `git-pack-objects`.
    quiet: Be quiet. Only print error messages.
    A: same as -a, and turn unreachable objects loose
    F: pass --no-reuse-object to git-pack-objects
    combine-cruft-below-size: combine cruft packs smaller than this size
    cruft: same as -a, pack unreachable cruft objects separately
    cruft-expiration: with --cruft, expire objects older than this
    d: remove redundant packs, and run git-prune-packed
    delta-islands: pass --delta-islands to git-pack-objects
    expire-to: pack prefix to store a pack containing pruned objects
    filter-to: pack prefix to store filtered-out objects
    geometric: find a geometric progression with factor <N>
    keep-pack: do not repack this pack
    keep-unreachable: with -a, repack unreachable objects
    max-cruft-size: maximum size of each cruft pack
    max-pack-size: maximum size of each packfile
    name-hash-version: name hash version for pack index
    pack-kept-objects: repack objects in packs marked with .keep
    path-walk: pass --path-walk to git-pack-objects
    threads: limits the maximum number of threads
    unpack-unreachable: with -A, do not loosen objects older than this
    window: size of the window used for delta compression
    window-memory: same as the above, but limit memory size instead of entries count
    write-bitmap-index: write bitmap index
    write-midx: write a multi-pack index of the resulting packs
