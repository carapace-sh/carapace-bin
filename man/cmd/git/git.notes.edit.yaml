# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: edit
description: Edit the notes for a given object
flags:
  --allow-empty: allow an empty note object to be stored
  --separator=: insert <paragraph-break> between paragraphs
  --stripspace: remove unnecessary whitespace
  -C, --reuse-message=: take the given blob object as the note message
  -F, --file=: take the note message from the given file
  -c, --reedit-message=: like -C, but with -c the editor is invoked
  -m, --message=: use the given note message
documentation:
  flag:
    allow-empty: |-
      Allow an empty note object to be stored. The default behavior is
      to automatically remove empty notes.
    file: |-
      Take the commit message from _<file>_.  Use `-` to
      read the message from the standard input.
    message: |-
      Use the given note message (instead of prompting).
      If multiple `-m` options are given, their values
      are concatenated as separate paragraphs.
    reedit-message: |-
      Like `-C`, but with `-c` the editor is invoked, so that
      the user can further edit the commit message.
    reuse-message: |-
      Take the given blob object (for example, another note) as the
      note message. (Use `git notes copy <object>` instead to
      copy notes between objects.)  Implies `--no-stripspace` since
      the default behavior is to copy the message verbatim.
    separator: insert <paragraph-break> between paragraphs
    stripspace: remove unnecessary whitespace
