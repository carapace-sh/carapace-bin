# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: terms
description: show the terms used for old and new commits
flags:
  --term-bad: show term for bad/new
  --term-good: show term for good/old
documentation:
  flag:
    term-bad: show term for bad/new
    term-good: show term for good/old
