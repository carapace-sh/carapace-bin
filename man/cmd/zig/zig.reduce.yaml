# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: reduce [options] ./checker root_source_file.zig [-- [argv]]
description: Minimize a bug report
group: source
flags:
    --deps=*: Set dependency names for the root package
    --main-mod-path=: Set the directory of the root module
    --mod=*: Make a module available for dependency under the given name
    --seed=: Override the random seed (default: 0)
    --skip-smoke-test: Skip interestingness check smoke test
    -h, --help: Print help
