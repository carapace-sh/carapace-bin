# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: squash
description: Squash commits since branching
flags:
    --dry-run: Preview prompt, command, and generated message without squashing
    --format=: Output format
    -h, --help: Print help (see more with '--help')
    --no-hooks: Skip hooks
    --no-verify: Skip hooks (deprecated alias for --no-hooks)
    --show-prompt: Render prompt to stdout without running LLM
    --stage=: What to stage before committing [default: all]
    -y, --yes: Skip approval prompts
