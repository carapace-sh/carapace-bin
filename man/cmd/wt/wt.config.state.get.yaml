# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: get
description: Get all stored state
flags:
    --format=:
        description: Output format
        default: table
    -h, --help: Print help (see more with '--help')
completion:
    flag:
        C:
            - $files
        config:
            - $files
        format:
            - table
            - json
