# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: completions
description: Generate shell completions for package managers
hidden: true
flags:
    -h, --help: Print help (see more with '--help')
completion:
    flag:
        C:
            - $files
        config:
            - $files
    positional:
        - - bash
          - fish
          - nu
          - zsh
          - powershell
documentation:
    command: |-
        Generate shell completions for package managers

        Outputs a completion registration that calls the binary at TAB time, so branch and worktree names complete from a plain package install. For interactive setup, run wt config shell install instead. It also enables directory changing on switch.
