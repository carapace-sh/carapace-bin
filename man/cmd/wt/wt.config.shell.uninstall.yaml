# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: uninstall
description: Remove shell integration from config files
flags:
    --dry-run: Show what would be changed
    -h, --help: Print help (see more with '--help')
completion:
    flag:
        C:
            - $files
        config:
            - $files
    positional:
        - - bash
          - fish
          - nu
          - zsh
          - powershell
