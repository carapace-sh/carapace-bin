# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: list
description: List project commands and their approval status
flags:
    --format=:
        description: Output format
        default: text
    -h, --help: Print help (see more with '--help')
completion:
    flag:
        C:
            - $files
        config:
            - $files
        format:
            - text
            - json
