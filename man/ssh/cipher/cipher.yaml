3des-cbc: |
  Triple-DES in CBC mode. Legacy cipher retained for compatibility; avoid when modern AEAD or CTR ciphers are available.
aes128-cbc: |
  AES with 128-bit key in CBC mode. Legacy mode; prefer CTR or AEAD ciphers when available.
aes192-cbc: |
  AES with 192-bit key in CBC mode. Legacy mode; prefer CTR or AEAD ciphers when available.
aes256-cbc: |
  AES with 256-bit key in CBC mode. Legacy mode; prefer CTR or AEAD ciphers when available.
aes128-ctr: |
  AES with 128-bit key in CTR mode. Widely supported and secure when used with a proper MAC.
aes192-ctr: |
  AES with 192-bit key in CTR mode. Widely supported and secure when used with a proper MAC.
aes256-ctr: |
  AES with 256-bit key in CTR mode. Widely supported and secure when used with a proper MAC.
aes128-gcm@openssh.com: |
  AES-GCM with 128-bit key. AEAD cipher providing encryption and integrity; efficient on systems with AES acceleration.
aes256-gcm@openssh.com: |
  AES-GCM with 256-bit key. AEAD cipher providing encryption and integrity; efficient on systems with AES acceleration.
chacha20-poly1305@openssh.com: |
  ChaCha20-Poly1305 AEAD cipher. Fast in software and secure; a common default on systems without AES acceleration.
